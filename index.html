<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>30枚カード対応 WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.94);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      text-align: center;
    }

    #startBtn {
      margin-top: 24px;
      padding: 18px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
      cursor: pointer;
    }

    #statusBadge {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      z-index: 1000;
      pointer-events: none;
      border: 1px solid rgba(56, 189, 248, 0.3);
      white-space: nowrap;
    }

    #controlPanel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 12px 16px;
      z-index: 1000;
      display: none;
      flex-direction: column;
      gap: 10px;
      color: #f8fafc;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.9rem;
    }

    #muteToggleBtn {
      width: 100%;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
    }
  </style>

  <script>
    const VIDEO_LIST = [
      "./動作3.mp4",  "./動作4.mp4",  "./動作5.mp4",  "./video3.mp4",  "./video4.mp4",
      "./video5.mp4",  "./video6.mp4",  "./video7.mp4",  "./video8.mp4",  "./video9.mp4",
      "./video10.mp4", "./video11.mp4", "./video12.mp4", "./video13.mp4", "./video14.mp4",
      "./video15.mp4", "./video16.mp4", "./video17.mp4", "./video18.mp4", "./video19.mp4",
      "./video20.mp4", "./video21.mp4", "./video22.mp4", "./video23.mp4", "./video24.mp4",
      "./video25.mp4", "./video26.mp4", "./video27.mp4", "./video28.mp4", "./video29.mp4"
    ];

    // 基準サイズ（縦長・横長どちらでも画面からはみ出しにくい基準値）
    const MAX_VIDEO_SIZE = 1.1;
    let currentAngleX = 35;
    let currentLoadedSrc = "./video0.mp4";

    // 動画本来の縦横比を計算して <a-video> のサイズを自動補正する関数
    function adjustVideoAspectRatio(videoEl) {
      const vw = videoEl.videoWidth;
      const vh = videoEl.videoHeight;
      if (!vw || !vh) return;

      let width, height;
      if (vw >= vh) {
        // 横長・正方形の動画
        width = MAX_VIDEO_SIZE;
        height = MAX_VIDEO_SIZE * (vh / vw);
      } else {
        // スマホ撮影などの縦長動画
        height = MAX_VIDEO_SIZE * 1.25;
        width = height * (vw / vh);
      }

      document.querySelectorAll(".ar-video-plane").forEach(plane => {
        plane.setAttribute("width", width.toFixed(3));
        plane.setAttribute("height", height.toFixed(3));
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.getElementById("arScene");
      const statusBadge = document.getElementById("statusBadge");
      const mainVideo = document.getElementById("mainVideo");

      // 動画のメタデータ（縦横サイズ）読み込み完了時に比率を自動補正
      mainVideo.addEventListener("loadedmetadata", () => {
        adjustVideoAspectRatio(mainVideo);
      });

      mainVideo.addEventListener("playing", () => {
        adjustVideoAspectRatio(mainVideo);
        statusBadge.style.color = "#10b981";
      });

      mainVideo.addEventListener("error", () => {
        statusBadge.textContent = `❌ 動画エラー(${currentLoadedSrc}が見つかりません)`;
        statusBadge.style.color = "#ef4444";
      });

      VIDEO_LIST.forEach((src, index) => {
        const targetEntity = document.createElement("a-entity");
        targetEntity.setAttribute("mindar-image-target", `targetIndex: ${index}`);

        const videoPlane = document.createElement("a-video");
        videoPlane.classList.add("ar-video-plane");
        videoPlane.setAttribute("src", "#mainVideo");
        videoPlane.setAttribute("width", 1);
        videoPlane.setAttribute("height", 1);
        videoPlane.setAttribute("position", "0 0 0.25");
        videoPlane.setAttribute("rotation", `${currentAngleX} 0 0`);

        targetEntity.appendChild(videoPlane);
        sceneEl.appendChild(targetEntity);

        targetEntity.addEventListener("targetFound", () => {
          statusBadge.textContent = `🎬 カード #${index + 1} を再生中`;
          statusBadge.style.color = "#10b981";

          if (currentLoadedSrc !== src) {
            currentLoadedSrc = src;
            mainVideo.pause();
            mainVideo.src = src;
            mainVideo.load();
          } else {
            adjustVideoAspectRatio(mainVideo);
          }

          mainVideo.play().catch(() => {
            statusBadge.textContent = `⏳ 読込中: ${src}`;
          });
        });

        targetEntity.addEventListener("targetLost", () => {
          mainVideo.pause();
          statusBadge.textContent = "🔍 カードを探しています...";
          statusBadge.style.color = "#38bdf8";
        });
      });
    });
  </script>
</head>
<body>

  <div id="startOverlay">
    <h1 style="font-size: 1.6rem; margin-bottom: 8px;">📸 カードARカメラ</h1>
    <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.5;">
      カメラを起動してカードにかざすと<br>対応する動画が再生されます。
    </p>
    <button id="startBtn" type="button">▶ ARをスタート</button>
  </div>

  <div id="statusBadge" style="display: none;">🔍 カードを探しています...</div>

  <div id="controlPanel">
    <div class="ctrl-row">
      <span>📐 動画の角度:</span>
      <input type="range" id="angleSlider" min="0" max="90" value="35" />
      <span id="angleVal" style="width: 36px; text-align: right;">35°</span>
    </div>
    <button id="muteToggleBtn" type="button">🔇 音声をオンにする</button>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: false, antialias: false"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video
        id="mainVideo"
        src="./video0.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script>
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");
    const statusBadge = document.getElementById("statusBadge");
    const controlPanel = document.getElementById("controlPanel");
    const muteToggleBtn = document.getElementById("muteToggleBtn");
    const angleSlider = document.getElementById("angleSlider");
    const angleVal = document.getElementById("angleVal");
    const mainVideo = document.getElementById("mainVideo");
    const sceneEl = document.getElementById("arScene");

    angleSlider.addEventListener("input", (e) => {
      const deg = e.target.value;
      angleVal.textContent = `${deg}°`;
      const zOffset = (deg / 90) * 0.45;
      document.querySelectorAll(".ar-video-plane").forEach(plane => {
        plane.setAttribute("rotation", `${deg} 0 0`);
        plane.setAttribute("position", `0 0 ${zOffset.toFixed(2)}`);
      });
    });

    muteToggleBtn.addEventListener("click", () => {
      mainVideo.muted = !mainVideo.muted;
      muteToggleBtn.textContent = mainVideo.muted ? "🔇 音声をオンにする" : "🔊 音声ON中";
      if (!mainVideo.paused) mainVideo.play();
    });

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      startBtn.textContent = "カメラ起動中...";

      mainVideo.play().then(() => {
        mainVideo.pause();
        mainVideo.currentTime = 0;
      }).catch(() => {});

      const arSystem = sceneEl.systems["mindar-image-system"];
      await arSystem.start();

      startOverlay.style.display = "none";
      statusBadge.style.display = "block";
      controlPanel.style.display = "flex";
    });
  </script>
</body>
</html>
