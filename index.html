<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>30枚カード対応 WebAR</title>

  <!-- A-Frame と MindAR.js の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* スタート画面のオーバーレイ（スマホの音声・カメラ許可取得用） */
    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.92);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      text-align: center;
    }

    #startBtn {
      margin-top: 24px;
      padding: 18px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
      cursor: pointer;
    }

    #startBtn:active {
      transform: scale(0.95);
    }

    /* 画面上部のステータス表示 */
    #statusBadge {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      z-index: 1000;
      pointer-events: none;
      border: 1px solid rgba(56, 189, 248, 0.3);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- スタート画面 -->
  <div id="startOverlay">
    <h1 style="font-size: 1.6rem; margin-bottom: 8px;">📸 カードARカメラ</h1>
    <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.5;">
      カメラを起動してカードにかざすと<br>対応する動画が再生されます。
    </p>
    <button id="startBtn" type="button">▶ ARをスタート</button>
  </div>

  <!-- 現在の認識状態 -->
  <div id="statusBadge" style="display: none;">🔍 カードを探しています...</div>

  <!-- ARシーン（autoStart: false にしてボタン押下で安全に起動） -->
  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- 動画を読み込むための共通プレイヤー（メモリ節約のため1つを使い回す） -->
    <a-assets>
      <video
        id="sharedVideo"
        src=""
        preload="none"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ここに0番〜29番のターゲットが自動生成されます -->
  </a-scene>

  <script>
    // ==========================================
    // 🎬 30枚分の動画ファイル設定（0番 〜 29番）
    // GitHubにアップロードする動画ファイル名と合わせてください
    // ==========================================
    const VIDEO_LIST = [
      "./動作3.mp4",  // 0番のカード
      "./動作4.mp4",  // 1番のカード
      "./動作5.mp4",  // 2番のカード
      "./video3.mp4",  // 3番のカード
      "./video4.mp4",  // 4番のカード
      "./video5.mp4",  // 5番のカード
      "./video6.mp4",  // 6番のカード
      "./video7.mp4",  // 7番のカード
      "./video8.mp4",  // 8番のカード
      "./video9.mp4",  // 9番のカード
      "./video10.mp4", // 10番のカード
      "./video11.mp4", // 11番のカード
      "./video12.mp4", // 12番のカード
      "./video13.mp4", // 13番のカード
      "./video14.mp4", // 14番のカード
      "./video15.mp4", // 15番のカード
      "./video16.mp4", // 16番のカード
      "./video17.mp4", // 17番のカード
      "./video18.mp4", // 18番のカード
      "./video19.mp4", // 19番のカード
      "./video20.mp4", // 20番のカード
      "./video21.mp4", // 21番のカード
      "./video22.mp4", // 22番のカード
      "./video23.mp4", // 23番のカード
      "./video24.mp4", // 24番のカード
      "./video25.mp4", // 25番のカード
      "./video26.mp4", // 26番のカード
      "./video27.mp4", // 27番のカード
      "./video28.mp4", // 28番のカード
      "./video29.mp4"  // 29番のカード
    ];

    // 動画の表示サイズ（カードの縦横比に合わせて調整可能）
    // 幅1を基準にした高さの比率（例: 16:9の横長なら 0.5625、正方形なら 1.0、縦長なら 1.4）
    const VIDEO_WIDTH = 1;
    const VIDEO_HEIGHT = 0.7;

    const sceneEl = document.getElementById("arScene");
    const sharedVideo = document.getElementById("sharedVideo");
    const statusBadge = document.getElementById("statusBadge");
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");

    let currentTargetIndex = -1;

    // 0番〜29番のARターゲットとイベントを自動構築
    VIDEO_LIST.forEach((videoSrc, index) => {
      const targetEntity = document.createElement("a-entity");
      targetEntity.setAttribute("mindar-image-target", `targetIndex: ${index}`);

      const videoPlane = document.createElement("a-video");
      videoPlane.setAttribute("src", "#sharedVideo");
      videoPlane.setAttribute("width", VIDEO_WIDTH);
      videoPlane.setAttribute("height", VIDEO_HEIGHT);
      videoPlane.setAttribute("position", "0 0 0");

      targetEntity.appendChild(videoPlane);
      sceneEl.appendChild(targetEntity);

      // カードを認識した瞬間
      targetEntity.addEventListener("targetFound", () => {
        currentTargetIndex = index;
        statusBadge.textContent = `🎬 カード #${index + 1} を再生中`;
        statusBadge.style.color = "#10b981";

        // 別のカードに切り替わった場合のみ動画ソースを差し替え
        if (sharedVideo.getAttribute("src") !== videoSrc) {
          sharedVideo.setAttribute("src", videoSrc);
          sharedVideo.load();
        }
        sharedVideo.play().catch((e) => console.log("再生待機:", e));
      });

      // カードがカメラから外れた瞬間
      targetEntity.addEventListener("targetLost", () => {
        if (currentTargetIndex === index) {
          sharedVideo.pause();
          statusBadge.textContent = "🔍 カードを探しています...";
          statusBadge.style.color = "#38bdf8";
        }
      });
    });

    // スタートボタン押下でカメラと音声制限を同時解除
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      startBtn.textContent = "カメラ起動中...";

      // スマホの自動再生ブロック解除用のダミー再生
      sharedVideo.play().then(() => sharedVideo.pause()).catch(() => {});

      const arSystem = sceneEl.systems["mindar-image-system"];
      await arSystem.start();

      startOverlay.style.display = "none";
      statusBadge.style.display = "block";
    });
  </script>
</body>
</html>
