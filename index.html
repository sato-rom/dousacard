<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR サウンドカード＆連続再生システム</title>

  <!-- Firebase App & Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 背景カメラ映像（AR空間ベース・正面固定） */
    #arCameraBg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #090d16;
    }

    /* AR空間上の固定オーバーレイレイヤー */
    .ar-hud-layer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 14px 48px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100dvh;
    }

    /* 起動オーバーレイ（音声ロック解除＆カメラ起動） */
    #arStartOverlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.94);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }

    #arStartBtn {
      padding: 18px 36px;
      font-size: 1.15rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.45);
      cursor: pointer;
    }

    /* 半透明グラスモーフィズムカード */
    .glass-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .app-badge {
      font-size: 1.02rem;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .always-on-pill {
      background: rgba(16, 185, 129, 0.22);
      border: 1px solid rgba(16, 185, 129, 0.55);
      color: #34d399;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .sync-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.74rem;
      color: #94a3b8;
      background: rgba(2, 6, 23, 0.65);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }

    /* AR中央の固定ホログラムカード表示枠（角度調整なし・正面固定） */
    .ar-stage-card {
      background: linear-gradient(145deg, rgba(14, 116, 144, 0.32), rgba(15, 23, 42, 0.85));
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 18px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.25);
    }

    .ar-stage-card.playing {
      border-color: #10b981;
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.45);
    }

    .ar-now-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 0.05em;
    }

    .ar-now-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      word-break: break-word;
    }

    .ar-queue-info {
      font-size: 0.78rem;
      color: #cbd5e1;
      background: rgba(2, 6, 23, 0.6);
      padding: 4px 12px;
      border-radius: 99px;
    }

    /* 連続再生コントロールボタン群 */
    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 0.84rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .btn-fav-play {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
    }

    .btn-sel-play {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
    }

    .btn-next {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    .btn-stop {
      background: #ef4444;
      color: #ffffff;
    }

    /* フィルタータブ（すべて / お気に入り / 選択中） */
    .filter-tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.85);
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* ARカード一覧 */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ar-sound-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid #334155;
      border-radius: 14px;
      padding: 11px 12px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .ar-sound-card.selected-card {
      border-color: #38bdf8;
      background: rgba(14, 116, 144, 0.24);
    }

    .ar-sound-card.now-playing-card {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.22);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
    }

    .select-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: #0f172a;
      background: #020617;
      flex-shrink: 0;
    }

    .ar-sound-card.selected-card .select-check {
      background: #38bdf8;
      border-color: #38bdf8;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: bold;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .fav-star-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #64748b;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fav-star-btn.is-fav {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
    }

    .single-play-btn {
      padding: 8px 11px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      background: #0f172a;
      color: #38bdf8;
      font-size: 0.76rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 共有グループID＆曲追加フォーム */
    .compact-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .text-input {
      flex: 1;
      background: #020617;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
    }

    .mini-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- 背景ARカメラ（正面固定） -->
  <video id="arCameraBg" autoplay muted playsinline></video>

  <!-- 起動オーバーレイ -->
  <div id="arStartOverlay">
    <h2 style="font-size: 1.45rem; color: #38bdf8;">🥽 AR サウンドカード</h2>
    <p style="color: #94a3b8; font-size: 0.9rem; line-height: 1.6;">
      音声は常にON状態で起動します。<br>お気に入り（★）や複数選択したカードを連続で再生できます。
    </p>
    <button id="arStartBtn" type="button">▶ ARビューを起動する</button>
  </div>

  <!-- AR固定HUDレイヤー -->
  <div class="ar-hud-layer">

    <!-- ヘッダー＆同期状態 -->
    <div class="glass-card">
      <div class="top-bar">
        <div class="app-badge">🥽 AR サウンドカード</div>
        <span class="always-on-pill">🔊 音声常時ON</span>
      </div>

      <div class="sync-row">
        <span id="syncStatusLabel">☁️ 同期待機中...</span>
        <div style="display:flex; align-items:center; gap:4px;">
          <input type="text" id="roomIdInput" class="text-input" style="width: 135px; padding: 4px 8px; font-size: 0.75rem;" placeholder="12文字以上のID" />
          <button type="button" id="connectRoomBtn" class="mini-btn" style="padding: 4px 8px; font-size: 0.74rem;">接続</button>
        </div>
      </div>
    </div>

    <!-- 正面固定ARカードステージ（角度調整なし） -->
    <div class="ar-stage-card" id="arStageCard">
      <div class="ar-now-label" id="arModeLabel">AR CARD READY（正面固定）</div>
      <div class="ar-now-title" id="arCurrentTitle">再生するカードを選んでください</div>
      <div class="ar-queue-info" id="arQueueStatus">お気に入り: 0曲 / 選択中: 0曲</div>
    </div>

    <!-- 連続再生コントロール -->
    <div class="glass-card">
      <div class="control-grid">
        <button type="button" class="action-btn btn-fav-play" id="playFavoritesSeqBtn">★ お気に入り連続再生</button>
        <button type="button" class="action-btn btn-sel-play" id="playSelectedSeqBtn">▶ 選択カード連続再生</button>
        <button type="button" class="action-btn btn-next" id="nextTrackBtn">⏭ 次のカードへ</button>
        <button type="button" class="action-btn btn-stop" id="stopPlaybackBtn">⏹ 再生停止</button>
      </div>
    </div>

    <!-- カード選択・お気に入り管理リスト -->
    <div class="glass-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.9rem; font-weight: bold; color: #38bdf8;">📋 サウンドカード一覧</span>
        <button type="button" id="clearSelectionBtn" class="mini-btn" style="background:#1e293b; color:#cbd5e1; border:1px solid #475569; padding:4px 8px; font-size:0.72rem;">選択全解除</button>
      </div>

      <div class="filter-tabs">
        <button type="button" class="tab-btn active" data-filter="all">すべて (<span id="countAllSpan">0</span>)</button>
        <button type="button" class="tab-btn" data-filter="fav">★ お気に入り (<span id="countFavSpan">0</span>)</button>
        <button type="button" class="tab-btn" data-filter="selected">☑ 選択中 (<span id="countSelSpan">0</span>)</button>
      </div>

      <div class="card-list" id="arCardListContainer"></div>

      <!-- クイック曲追加 -->
      <div style="padding-top: 8px; border-top: 1px dashed #334155; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 0.76rem; color: #94a3b8;">＋ 新しいカード（音声ファイル・URL）を追加</div>
        <div class="compact-row">
          <input type="text" id="addCardTitleInput" class="text-input" placeholder="カード名" />
          <input type="text" id="addCardUrlInput" class="text-input" placeholder="./sound.mp3 や URL" />
          <button type="button" id="addCardBtn" class="mini-btn">追加</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // =========================================================
    // Firebase設定
    // =========================================================
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBXIOyPImlqiPAX-4JbZ_LNZrzT9_SIazc",
      authDomain: "sotugyouken-2ec79.firebaseapp.com",
      databaseURL: "https://sotugyouken-2ec79-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sotugyouken-2ec79",
      storageBucket: "sotugyouken-2ec79.firebasestorage.app",
      messagingSenderId: "682579514497",
      appId: "1:682579514497:web:f4f3cb5b33637d7dade980",
      measurementId: "G-6SXYHSS0H8"
    };

    const DEFAULT_SONGS = [
      {
        title: "サンプル音 1（ファンファーレ）",
        url: "https://actions.google.com/sounds/v1/alarms/bugle_tune.ogg",
        baseVolume: 80,
        peakVolume: 100,
        duration: 15,
        favorite: true
      },
      {
        title: "サンプル音 2（効果音）",
        url: "https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg",
        baseVolume: 90,
        peakVolume: 100,
        duration: 5,
        favorite: false
      }
    ];

    // DOM要素
    const arCameraBg = document.getElementById("arCameraBg");
    const arStartOverlay = document.getElementById("arStartOverlay");
    const arStartBtn = document.getElementById("arStartBtn");

    const syncStatusLabel = document.getElementById("syncStatusLabel");
    const roomIdInput = document.getElementById("roomIdInput");
    const connectRoomBtn = document.getElementById("connectRoomBtn");

    const arStageCard = document.getElementById("arStageCard");
    const arModeLabel = document.getElementById("arModeLabel");
    const arCurrentTitle = document.getElementById("arCurrentTitle");
    const arQueueStatus = document.getElementById("arQueueStatus");

    const playFavoritesSeqBtn = document.getElementById("playFavoritesSeqBtn");
    const playSelectedSeqBtn = document.getElementById("playSelectedSeqBtn");
    const nextTrackBtn = document.getElementById("nextTrackBtn");
    const stopPlaybackBtn = document.getElementById("stopPlaybackBtn");
    const clearSelectionBtn = document.getElementById("clearSelectionBtn");

    const filterTabBtns = document.querySelectorAll(".tab-btn");
    const countAllSpan = document.getElementById("countAllSpan");
    const countFavSpan = document.getElementById("countFavSpan");
    const countSelSpan = document.getElementById("countSelSpan");
    const arCardListContainer = document.getElementById("arCardListContainer");

    const addCardTitleInput = document.getElementById("addCardTitleInput");
    const addCardUrlInput = document.getElementById("addCardUrlInput");
    const addCardBtn = document.getElementById("addCardBtn");

    // 状態管理
    let firestoreDb = null;
    let unsubscribeFirestore = null;
    let isApplyingRemote = false;
    let syncTimer = null;
    const CLIENT_ID = `ar_${Math.random().toString(36).slice(2, 10)}`;

    let syncGroupId = localStorage.getItem("person_sound_sync_group_v1") || "default_room";
    roomIdInput.value = syncGroupId;

    let songList = [];
    let selectedIndices = new Set();
    let currentFilter = "all";

    // 連続再生キュー管理
    let playQueue = [];
    let queueCursor = -1;
    let queueModeName = "";
    let currentPlayingSongIdx = -1;
    let durationStopTimer = null;

    // 音声プレーヤー（常にミュート解除・音声ON固定）
    const audioPlayer = new Audio();
    audioPlayer.preload = "auto";
    audioPlayer.muted = false;

    function normalizeAudioPath(rawInput) {
      const trimmed = (rawInput || "").trim();
      if (!trimmed) return "";
      if (/^https?:\/\//i.test(trimmed)) {
        try {
          const u = new URL(trimmed);
          if (u.hostname.includes("dropbox.com")) {
            u.searchParams.delete("dl");
            u.searchParams.set("raw", "1");
            return u.toString();
          }
        } catch (e) {}
        return trimmed;
      }
      if (/^(\.\/|\.\.\/|\/)/i.test(trimmed)) return trimmed;
      return `./${trimmed}`;
    }

    function resolveSafeAudioUrl(rawPath) {
      const normalized = normalizeAudioPath(rawPath);
      if (/^https?:\/\//i.test(normalized)) return normalized;
      const fullUrl = new URL(normalized, window.location.href).href;
      return encodeURI(decodeURI(fullUrl));
    }

    function normalizeSong(s) {
      return {
        ...s,
        title: s.title || "無題のカード",
        url: normalizeAudioPath(s.url || ""),
        baseVolume: typeof s.baseVolume === "number" ? s.baseVolume : 85,
        peakVolume: typeof s.peakVolume === "number" ? s.peakVolume : 100,
        duration: typeof s.duration === "number" ? s.duration : 0,
        favorite: Boolean(s.favorite)
      };
    }

    function loadLocalSongs() {
      const raw = JSON.parse(localStorage.getItem("person_sound_songs_v6") || "null");
      songList = Array.isArray(raw) && raw.length > 0
        ? raw.map(normalizeSong)
        : DEFAULT_SONGS.map(normalizeSong);
    }

    function saveAndSyncSongs() {
      localStorage.setItem("person_sound_songs_v6", JSON.stringify(songList));
      renderCards();

      if (!firestoreDb || isApplyingRemote) return;
      if (syncTimer) clearTimeout(syncTimer);

      syncStatusLabel.textContent = "☁️ クラウド同期中...";
      syncStatusLabel.style.color = "#f59e0b";

      syncTimer = setTimeout(async () => {
        try {
          await firestoreDb.collection("entry_exit_shared_rooms").doc(syncGroupId).set({
            updatedAt: Date.now(),
            updatedBy: CLIENT_ID,
            songList
          }, { merge: true });
          syncStatusLabel.textContent = `✅ 同期済み (${syncGroupId})`;
          syncStatusLabel.style.color = "#10b981";
        } catch (e) {
          syncStatusLabel.textContent = "⚠️ 同期エラー（12文字以上のIDを確認）";
          syncStatusLabel.style.color = "#ef4444";
        }
      }, 400);
    }

    function connectFirestore(groupId) {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        firestoreDb = firebase.firestore();

        if (unsubscribeFirestore) {
          unsubscribeFirestore();
          unsubscribeFirestore = null;
        }

        syncStatusLabel.textContent = `☁️ 接続中 (${groupId})...`;
        syncStatusLabel.style.color = "#38bdf8";

        unsubscribeFirestore = firestoreDb.collection("entry_exit_shared_rooms").doc(groupId)
          .onSnapshot((snap) => {
            if (snap.exists) {
              const data = snap.data();
              if (data.updatedBy !== CLIENT_ID && Array.isArray(data.songList)) {
                isApplyingRemote = true;
                songList = data.songList.map(normalizeSong);
                localStorage.setItem("person_sound_songs_v6", JSON.stringify(songList));
                renderCards();
                isApplyingRemote = false;
              }
              syncStatusLabel.textContent = `✅ 同期中 (${groupId})`;
              syncStatusLabel.style.color = "#10b981";
            } else {
              saveAndSyncSongs();
            }
          }, () => {
            syncStatusLabel.textContent = "⚠️ 同期エラー（12文字以上のIDを指定）";
            syncStatusLabel.style.color = "#ef4444";
          });
      } catch (e) {
        syncStatusLabel.textContent = "📱 ローカル動作中";
      }
    }

    connectRoomBtn.addEventListener("click", () => {
      const nextId = roomIdInput.value.trim().replace(/[^a-zA-Z0-9_-]/g, "") || "default_room";
      roomIdInput.value = nextId;
      syncGroupId = nextId;
      localStorage.setItem("person_sound_sync_group_v1", syncGroupId);
      connectFirestore(syncGroupId);
    });

    // =========================================================
    // 再生・連続再生ロジック（音声は常にON）
    // =========================================================
    function clearPlaybackTimers() {
      if (durationStopTimer) {
        clearTimeout(durationStopTimer);
        durationStopTimer = null;
      }
    }

    function stopAllPlayback() {
      clearPlaybackTimers();
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      playQueue = [];
      queueCursor = -1;
      queueModeName = "";
      currentPlayingSongIdx = -1;

      arStageCard.classList.remove("playing");
      arModeLabel.textContent = "AR CARD READY（正面固定）";
      arCurrentTitle.textContent = "再生停止中";
      renderCards();
    }

    function playSongAtIndex(songIdx, isFromQueue = false) {
      const song = songList[songIdx];
      if (!song) {
        stopAllPlayback();
        return;
      }

      clearPlaybackTimers();
      currentPlayingSongIdx = songIdx;

      // 常にミュート解除・音声ON（最小音量0でも聞こえるよう下限を保護）
      audioPlayer.muted = false;
      const volRatio = Math.max(0.15, Math.min(1.0, (song.peakVolume || song.baseVolume || 85) / 100));
      audioPlayer.volume = volRatio;
      audioPlayer.src = resolveSafeAudioUrl(song.url);

      audioPlayer.play().then(() => {
        arStageCard.classList.add("playing");
        if (isFromQueue && playQueue.length > 0) {
          arModeLabel.textContent = `${queueModeName}（${queueCursor + 1} / ${playQueue.length}枚目）`;
        } else {
          arModeLabel.textContent = "▶ 単体カード再生中（音声ON）";
        }
        arCurrentTitle.textContent = `${song.favorite ? "★ " : ""}${song.title}`;
        renderCards();

        if (song.duration > 0) {
          durationStopTimer = setTimeout(() => {
            handleTrackFinished();
          }, song.duration * 1000);
        }
      }).catch(() => {
        arCurrentTitle.textContent = `❌ 再生失敗: ${song.title}`;
        if (isFromQueue) {
          setTimeout(() => handleTrackFinished(), 800);
        }
      });
    }

    function handleTrackFinished() {
      clearPlaybackTimers();
      if (playQueue.length > 0 && queueCursor + 1 < playQueue.length) {
        queueCursor++;
        playSongAtIndex(playQueue[queueCursor], true);
      } else {
        const finishedMode = queueModeName;
        stopAllPlayback();
        if (finishedMode) {
          arCurrentTitle.textContent = `✅ ${finishedMode} 完了`;
        }
      }
    }

    audioPlayer.addEventListener("ended", handleTrackFinished);

    function startSequentialPlayback(indicesArray, modeTitle) {
      if (!indicesArray || indicesArray.length === 0) {
        arModeLabel.textContent = "⚠️ 再生対象がありません";
        arCurrentTitle.textContent = modeTitle.includes("お気に入り")
          ? "先にカードの「☆」を押してお気に入り登録してください"
          : "先にカードをタップしてチェックを入れてください";
        return;
      }
      playQueue = [...indicesArray];
      queueCursor = 0;
      queueModeName = modeTitle;
      playSongAtIndex(playQueue[0], true);
    }

    playFavoritesSeqBtn.addEventListener("click", () => {
      const favIndices = songList
        .map((s, idx) => (s.favorite ? idx : -1))
        .filter(idx => idx !== -1);
      startSequentialPlayback(favIndices, "★ お気に入り連続再生");
    });

    playSelectedSeqBtn.addEventListener("click", () => {
      const selIndices = Array.from(selectedIndices)
        .filter(idx => idx >= 0 && idx < songList.length)
        .sort((a, b) => a - b);
      startSequentialPlayback(selIndices, "▶ 選択カード連続再生");
    });

    nextTrackBtn.addEventListener("click", () => {
      if (playQueue.length > 0 && queueCursor + 1 < playQueue.length) {
        queueCursor++;
        playSongAtIndex(playQueue[queueCursor], true);
      } else if (songList.length > 0) {
        const nextIdx = (currentPlayingSongIdx + 1) % songList.length;
        playQueue = [];
        queueCursor = -1;
        playSongAtIndex(nextIdx, false);
      }
    });

    stopPlaybackBtn.addEventListener("click", stopAllPlayback);

    clearSelectionBtn.addEventListener("click", () => {
      selectedIndices.clear();
      renderCards();
    });

    // =========================================================
    // カード一覧描画＆お気に入り・選択操作
    // =========================================================
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function updateCounters() {
      const favCount = songList.filter(s => s.favorite).length;
      // 範囲外の選択インデックスを掃除
      selectedIndices.forEach(idx => {
        if (idx < 0 || idx >= songList.length) selectedIndices.delete(idx);
      });
      const selCount = selectedIndices.size;

      countAllSpan.textContent = songList.length;
      countFavSpan.textContent = favCount;
      countSelSpan.textContent = selCount;
      arQueueStatus.textContent = `★ お気に入り: ${favCount}枚 / ☑ 選択中: ${selCount}枚`;
    }

    function renderCards() {
      updateCounters();
      arCardListContainer.innerHTML = "";

      const entries = songList
        .map((song, idx) => ({ song, idx }))
        .filter(({ song, idx }) => {
          if (currentFilter === "fav") return song.favorite;
          if (currentFilter === "selected") return selectedIndices.has(idx);
          return true;
        });

      if (entries.length === 0) {
        arCardListContainer.innerHTML = `<div style="text-align:center; color:#64748b; font-size:0.82rem; padding:14px;">該当するカードがありません</div>`;
        return;
      }

      entries.forEach(({ song, idx }) => {
        const isSelected = selectedIndices.has(idx);
        const isPlaying = currentPlayingSongIdx === idx;

        const card = document.createElement("div");
        card.className = "ar-sound-card"
          + (isSelected ? " selected-card" : "")
          + (isPlaying ? " now-playing-card" : "");

        const leftArea = document.createElement("div");
        leftArea.className = "card-left";
        leftArea.innerHTML = `
          <div class="select-check">${isSelected ? "✓" : ""}</div>
          <div style="overflow: hidden;">
            <div class="card-title">${idx + 1}. ${escapeHtml(song.title)}</div>
            <div class="card-sub">${song.duration > 0 ? `⏱️ ${song.duration}秒` : "⏱️ 最後まで"} ・ ${isSelected ? "連続再生に選択済" : "タップで選択"}</div>
          </div>
        `;
        leftArea.addEventListener("click", () => {
          if (selectedIndices.has(idx)) {
            selectedIndices.delete(idx);
          } else {
            selectedIndices.add(idx);
          }
          renderCards();
        });

        const rightActions = document.createElement("div");
        rightActions.className = "card-actions";

        const favBtn = document.createElement("button");
        favBtn.type = "button";
        favBtn.className = "fav-star-btn" + (song.favorite ? " is-fav" : "");
        favBtn.textContent = song.favorite ? "★" : "☆";
        favBtn.title = "お気に入り切替";
        favBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          songList[idx].favorite = !songList[idx].favorite;
          saveAndSyncSongs();
        });

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "single-play-btn";
        playBtn.textContent = isPlaying ? "🔊 再生中" : "▶ 再生";
        playBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          playQueue = [];
          queueCursor = -1;
          playSongAtIndex(idx, false);
        });

        rightActions.appendChild(favBtn);
        rightActions.appendChild(playBtn);

        card.appendChild(leftArea);
        card.appendChild(rightActions);
        arCardListContainer.appendChild(card);
      });
    }

    filterTabBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        filterTabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderCards();
      });
    });

    addCardBtn.addEventListener("click", () => {
      const normalizedUrl = normalizeAudioPath(addCardUrlInput.value);
      if (!normalizedUrl) return;
      let title = addCardTitleInput.value.trim();
      if (!title) {
        const clean = normalizedUrl.split("?")[0];
        title = decodeURIComponent(clean.substring(clean.lastIndexOf("/") + 1)) || `カード ${songList.length + 1}`;
      }
      songList.push(normalizeSong({
        title,
        url: normalizedUrl,
        baseVolume: 85,
        peakVolume: 100,
        duration: 0,
        favorite: false
      }));
      addCardTitleInput.value = "";
      addCardUrlInput.value = "";
      saveAndSyncSongs();
    });

    // =========================================================
    // ARカメラ起動（正面固定・角度調整なし）
    // =========================================================
    async function startArCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        arCameraBg.srcObject = stream;
        await arCameraBg.play();
      } catch (e) {
        // カメラ未許可・PC環境でもARカードUIはそのまま利用可能
      }
    }

    arStartBtn.addEventListener("click", async () => {
      audioPlayer.muted = false;
      audioPlayer.play().then(() => audioPlayer.pause()).catch(() => {});
      arStartOverlay.style.display = "none";
      await startArCamera();
    });

    // 初期化
    loadLocalSongs();
    renderCards();
    connectFirestore(syncGroupId);
  </script>
</body>
</html>
