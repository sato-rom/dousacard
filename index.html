<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>30枚カード対応 WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.94);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      text-align: center;
    }

    #startBtn {
      margin-top: 24px;
      padding: 18px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
      cursor: pointer;
    }

    #statusBadge {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      z-index: 1000;
      pointer-events: none;
      border: 1px solid rgba(56, 189, 248, 0.3);
      white-space: nowrap;
    }

    #muteToggleBtn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      border: 1px solid #38bdf8;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      z-index: 1000;
      cursor: pointer;
      display: none;
    }
  </style>

  <!-- A-Frameが初期化される「前」に30枚分のターゲットを確実に生成するスクリプト -->
  <script>
    const VIDEO_LIST = [
      "./動作3.mp4",  "./動作4.mp4",  "./動作5.mp4",  "./video3.mp4",  "./video4.mp4",
      "./video5.mp4",  "./video6.mp4",  "./video7.mp4",  "./video8.mp4",  "./video9.mp4",
      "./video10.mp4", "./video11.mp4", "./video12.mp4", "./video13.mp4", "./video14.mp4",
      "./video15.mp4", "./video16.mp4", "./video17.mp4", "./video18.mp4", "./video19.mp4",
      "./video20.mp4", "./video21.mp4", "./video22.mp4", "./video23.mp4", "./video24.mp4",
      "./video25.mp4", "./video26.mp4", "./video27.mp4", "./video28.mp4", "./video29.mp4"
    ];

    const VIDEO_WIDTH = 1;
    const VIDEO_HEIGHT = 0.7;

    // A-Frameのシーン起動前にHTML要素を構築
    document.addEventListener("DOMContentLoaded", () => {
      const assetsEl = document.getElementById("arAssets");
      const sceneEl = document.getElementById("arScene");
      const statusBadge = document.getElementById("statusBadge");

      VIDEO_LIST.forEach((src, index) => {
        // 1. 各カード専用のvideoタグを生成（preload="metadata"でメモリを節約しつつテクスチャバグを回避）
        const videoEl = document.createElement("video");
        videoEl.id = `vid_${index}`;
        videoEl.src = src;
        videoEl.setAttribute("preload", "metadata");
        videoEl.setAttribute("loop", "");
        videoEl.setAttribute("muted", "");
        videoEl.setAttribute("playsinline", "");
        videoEl.setAttribute("webkit-playsinline", "");
        videoEl.setAttribute("crossorigin", "anonymous");
        videoEl.muted = true;
        assetsEl.appendChild(videoEl);

        // 2. 各ターゲットエンティティを生成
        const targetEntity = document.createElement("a-entity");
        targetEntity.setAttribute("mindar-image-target", `targetIndex: ${index}`);

        const videoPlane = document.createElement("a-video");
        videoPlane.setAttribute("src", `#vid_${index}`);
        videoPlane.setAttribute("width", VIDEO_WIDTH);
        videoPlane.setAttribute("height", VIDEO_HEIGHT);
        videoPlane.setAttribute("position", "0 0 0");

        targetEntity.appendChild(videoPlane);
        sceneEl.appendChild(targetEntity);

        // 認識した時
        targetEntity.addEventListener("targetFound", () => {
          statusBadge.textContent = `🎬 カード #${index + 1} を再生中`;
          statusBadge.style.color = "#10b981";
          
          // 他の動画が鳴っていたら止める
          document.querySelectorAll("video").forEach(v => {
            if (v.id !== `vid_${index}`) v.pause();
          });

          videoEl.play().catch(e => {
            statusBadge.textContent = `⚠️ 動画が見つかりません: ${src}`;
            statusBadge.style.color = "#ef4444";
          });
        });

        // カメラから外れた時
        targetEntity.addEventListener("targetLost", () => {
          videoEl.pause();
          statusBadge.textContent = "🔍 カードを探しています...";
          statusBadge.style.color = "#38bdf8";
        });
      });
    });
  </script>
</head>
<body>

  <div id="startOverlay">
    <h1 style="font-size: 1.6rem; margin-bottom: 8px;">📸 カードARカメラ</h1>
    <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.5;">
      カメラを起動してカードにかざすと<br>対応する動画が再生されます。
    </p>
    <button id="startBtn" type="button">▶ ARをスタート</button>
  </div>

  <div id="statusBadge" style="display: none;">🔍 カードを探しています...</div>
  <button id="muteToggleBtn" type="button">🔇 音声をオンにする</button>

  <!-- maxTrack: 2 に設定し、別のカードへの切り替え反応を高速化 -->
  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 2; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets id="arAssets"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script>
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");
    const statusBadge = document.getElementById("statusBadge");
    const muteToggleBtn = document.getElementById("muteToggleBtn");
    const sceneEl = document.getElementById("arScene");

    let isMuted = true;

    // 音声オン・オフ切り替え
    muteToggleBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      document.querySelectorAll("video").forEach(v => {
        v.muted = isMuted;
      });
      muteToggleBtn.textContent = isMuted ? "🔇 音声をオンにする" : "🔊 音声ON中";
    });

    // ARスタートボタン
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      startBtn.textContent = "カメラ起動中...";

      // すべてのvideo要素のブラウザ再生ロックを解除
      document.querySelectorAll("video").forEach(v => {
        v.play().then(() => v.pause()).catch(() => {});
      });

      const arSystem = sceneEl.systems["mindar-image-system"];
      await arSystem.start();

      startOverlay.style.display = "none";
      statusBadge.style.display = "block";
      muteToggleBtn.style.display = "block";
    });
  </script>
</body>
</html>
