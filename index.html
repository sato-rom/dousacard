<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR カード動画リーダー（お気に入り・連続再生対応）</title>

  <!-- A-Frame & MindAR（画像カード認識ライブラリ） -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    /* ARシーン（全画面背景） */
    #arSceneWrapper {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* 起動オーバーレイ */
    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }

    #startArBtn {
      padding: 18px 36px;
      font-size: 1.15rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.45);
      cursor: pointer;
    }

    /* 上部ステータスバー */
    .top-hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .status-pill-bar {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 0.8rem;
      text-align: center;
    }

    /* 正面固定の連続再生・認識動画シアター枠 */
    #videoTheaterOverlay {
      position: fixed;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 440px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 2px solid #38bdf8;
      border-radius: 18px;
      padding: 10px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }

    #videoTheaterOverlay.active {
      display: flex;
    }

    #mainVideoPlayer {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      object-fit: contain;
    }

    .theater-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
    }

    /* 下部ドロワー（カード一覧・お気に入り・連続再生操作） */
    .bottom-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px 20px 0 0;
      padding: 12px 14px 20px;
      max-height: 50dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.25s ease;
    }

    .bottom-panel.collapsed {
      transform: translateY(calc(100% - 50px));
    }

    .panel-handle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }

    .control-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 10px 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-fav-seq {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
    }

    .btn-sel-seq {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
    }

    .btn-next {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    .btn-stop {
      background: #ef4444;
      color: #ffffff;
    }

    /* フィルタータブ */
    .filter-row {
      display: flex;
      gap: 6px;
    }

    .filter-tab {
      flex: 1;
      padding: 6px 4px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .filter-tab.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
    }

    /* スクロール可能なカードリスト */
    .card-scroll-area {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 2px;
    }

    .video-card-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 12px;
      padding: 9px 10px;
    }

    .video-card-item.is-selected {
      border-color: #38bdf8;
      background: rgba(14, 116, 144, 0.25);
    }

    .video-card-item.is-playing {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.22);
    }

    .card-select-area {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
    }

    .check-box {
      width: 21px;
      height: 21px;
      border-radius: 6px;
      border: 2px solid #475569;
      background: #020617;
      color: #0f172a;
      font-size: 0.78rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .video-card-item.is-selected .check-box {
      background: #38bdf8;
      border-color: #38bdf8;
    }

    .card-title-text {
      font-size: 0.88rem;
      font-weight: bold;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta-text {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .card-right-btns {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .star-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .star-btn.active {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .play-one-btn {
      padding: 7px 10px;
      border-radius: 9px;
      border: 1px solid #38bdf8;
      background: #1e293b;
      color: #38bdf8;
      font-size: 0.74rem;
      font-weight: bold;
      cursor: pointer;
    }

    .add-row {
      display: flex;
      gap: 5px;
      padding-top: 6px;
      border-top: 1px dashed #334155;
    }

    .mini-input {
      flex: 1;
      background: #020617;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.76rem;
      min-width: 0;
    }

    .mini-add-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.76rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- 起動オーバーレイ（カメラ許可＆動画音声の再生許可） -->
  <div id="startOverlay">
    <h2 style="font-size: 1.45rem; color: #38bdf8;">🎬 AR カード動画リーダー</h2>
    <p style="color: #94a3b8; font-size: 0.88rem; line-height: 1.6;">
      カメラにカードをかざすと動画を再生します。<br>
      お気に入り（★）登録や、選んだカードの連続再生も可能です。
    </p>
    <button id="startArBtn" type="button">▶ カメラ＆ARを起動する</button>
  </div>

  <!-- 上部ステータスHUD -->
  <div class="top-hud">
    <div class="status-pill-bar">
      <span id="scanStatusText" style="color: #38bdf8; font-weight: bold;">📷 カードをかざすか下から選択</span>
    </div>
  </div>

  <!-- 正面固定 動画再生シアター枠 -->
  <div id="videoTheaterOverlay">
    <div class="theater-header">
      <span id="theaterQueueBadge" style="color: #38bdf8; font-weight: bold;">▶ 再生中</span>
      <button type="button" id="closeTheaterBtn" style="background:#ef4444; color:#fff; border:none; border-radius:7px; padding:4px 9px; font-size:0.74rem; font-weight:bold; cursor:pointer;">✕ 閉じる</button>
    </div>
    <video id="mainVideoPlayer" playsinline controls></video>
    <div id="theaterVideoTitle" style="font-size: 0.9rem; font-weight: bold; color: #f8fafc; text-align: center;"></div>
  </div>

  <!-- A-Frame + MindAR カメラシーン（カード認識エンジン） -->
  <div id="arSceneWrapper">
    <a-scene
      id="mindArScene"
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="targetSlot0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="targetSlot1" mindar-image-target="targetIndex: 1"></a-entity>
      <a-entity id="targetSlot2" mindar-image-target="targetIndex: 2"></a-entity>
      <a-entity id="targetSlot3" mindar-image-target="targetIndex: 3"></a-entity>
      <a-entity id="targetSlot4" mindar-image-target="targetIndex: 4"></a-entity>
      <a-entity id="targetSlot5" mindar-image-target="targetIndex: 5"></a-entity>
      <a-entity id="targetSlot6" mindar-image-target="targetIndex: 6"></a-entity>
      <a-entity id="targetSlot7" mindar-image-target="targetIndex: 7"></a-entity>
      <a-entity id="targetSlot8" mindar-image-target="targetIndex: 8"></a-entity>
      <a-entity id="targetSlot9" mindar-image-target="targetIndex: 9"></a-entity>
    </a-scene>
  </div>

  <!-- 下部操作パネル（お気に入り・選択カード連続再生） -->
  <div class="bottom-panel" id="bottomPanel">
    <div class="panel-handle-row" id="panelToggleHeader">
      <span style="font-size: 0.9rem; font-weight: bold; color: #38bdf8;">🎬 動画カード一覧・連続再生</span>
      <span id="panelToggleHint" style="font-size: 0.74rem; color: #94a3b8;">▼ 折りたたむ</span>
    </div>

    <div class="control-btn-grid">
      <button type="button" class="btn btn-fav-seq" id="playFavSeqBtn">★ お気に入り連続再生</button>
      <button type="button" class="btn btn-sel-seq" id="playSelSeqBtn">▶ 選択カードを連続再生</button>
      <button type="button" class="btn btn-next" id="nextVideoBtn">⏭ 次の動画へ</button>
      <button type="button" class="btn btn-stop" id="stopVideoBtn">⏹ 再生停止</button>
    </div>

    <div class="filter-row">
      <button type="button" class="filter-tab active" data-filter="all">すべて (<span id="cntAll">0</span>)</button>
      <button type="button" class="filter-tab" data-filter="fav">★ お気に入り (<span id="cntFav">0</span>)</button>
      <button type="button" class="filter-tab" data-filter="selected">☑ 選択中 (<span id="cntSel">0</span>)</button>
    </div>

    <div class="card-scroll-area" id="cardListContainer"></div>

    <!-- 新規動画カード追加 & 選択解除 -->
    <div class="add-row">
      <input type="text" id="newCardTitle" class="mini-input" placeholder="カード名" />
      <input type="text" id="newCardVideoUrl" class="mini-input" placeholder="./video1.mp4 や URL" />
      <button type="button" id="addVideoCardBtn" class="mini-add-btn">＋追加</button>
      <button type="button" id="clearSelBtn" class="mini-add-btn" style="background:#334155; color:#cbd5e1;">選択解除</button>
    </div>
  </div>

  <script>
    const DEFAULT_VIDEO_CARDS = [
      {
        targetIndex: 0,
        title: "カード1：サンプル動画",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        favorite: true
      },
      {
        targetIndex: 1,
        title: "カード2：サンプル動画",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        favorite: false
      }
    ];

    // DOM参照
    const startOverlay = document.getElementById("startOverlay");
    const startArBtn = document.getElementById("startArBtn");
    const mindArScene = document.getElementById("mindArScene");
    const scanStatusText = document.getElementById("scanStatusText");

    const videoTheaterOverlay = document.getElementById("videoTheaterOverlay");
    const mainVideoPlayer = document.getElementById("mainVideoPlayer");
    const theaterQueueBadge = document.getElementById("theaterQueueBadge");
    const theaterVideoTitle = document.getElementById("theaterVideoTitle");
    const closeTheaterBtn = document.getElementById("closeTheaterBtn");

    const bottomPanel = document.getElementById("bottomPanel");
    const panelToggleHeader = document.getElementById("panelToggleHeader");
    const panelToggleHint = document.getElementById("panelToggleHint");

    const playFavSeqBtn = document.getElementById("playFavSeqBtn");
    const playSelSeqBtn = document.getElementById("playSelSeqBtn");
    const nextVideoBtn = document.getElementById("nextVideoBtn");
    const stopVideoBtn = document.getElementById("stopVideoBtn");
    const clearSelBtn = document.getElementById("clearSelBtn");

    const filterTabs = document.querySelectorAll(".filter-tab");
    const cntAll = document.getElementById("cntAll");
    const cntFav = document.getElementById("cntFav");
    const cntSel = document.getElementById("cntSel");
    const cardListContainer = document.getElementById("cardListContainer");

    const newCardTitle = document.getElementById("newCardTitle");
    const newCardVideoUrl = document.getElementById("newCardVideoUrl");
    const addVideoCardBtn = document.getElementById("addVideoCardBtn");

    // 状態変数
    let videoCards = [];
    let selectedSet = new Set();
    let activeFilter = "all";

    // 連続再生キュー
    let playQueue = [];
    let queuePos = -1;
    let queueLabel = "";
    let currentPlayingIdx = -1;

    function normalizeMediaUrl(raw) {
      const s = (raw || "").trim();
      if (!s) return "";
      if (/^https?:\/\//i.test(s)) {
        try {
          const u = new URL(s);
          if (u.hostname.includes("dropbox.com")) {
            u.searchParams.delete("dl");
            u.searchParams.set("raw", "1");
            return u.toString();
          }
        } catch (e) {}
        return s;
      }
      if (/^(\.\/|\.\.\/|\/)/i.test(s)) return s;
      return `./${s}`;
    }

    function resolvePlayableUrl(raw) {
      const norm = normalizeMediaUrl(raw);
      if (/^https?:\/\//i.test(norm)) return norm;
      const full = new URL(norm, window.location.href).href;
      return encodeURI(decodeURI(full));
    }

    function loadCardsFromLocal() {
      const saved = JSON.parse(localStorage.getItem("ar_video_cards_v1") || "null");
      videoCards = Array.isArray(saved) && saved.length > 0
        ? saved
        : DEFAULT_VIDEO_CARDS.map(c => ({ ...c }));
    }

    function saveCards() {
      localStorage.setItem("ar_video_cards_v1", JSON.stringify(videoCards));
      renderCardList();
    }

    // =========================================================
    // 動画再生・連続再生エンジン
    // =========================================================
    function stopVideoPlayback() {
      mainVideoPlayer.pause();
      mainVideoPlayer.removeAttribute("src");
      mainVideoPlayer.load();
      videoTheaterOverlay.classList.remove("active");

      playQueue = [];
      queuePos = -1;
      queueLabel = "";
      currentPlayingIdx = -1;
      scanStatusText.textContent = "📷 カードをかざすか下から選択";
      renderCardList();
    }

    function playVideoCard(idx, fromQueue = false) {
      const card = videoCards[idx];
      if (!card) {
        stopVideoPlayback();
        return;
      }

      currentPlayingIdx = idx;
      videoTheaterOverlay.classList.add("active");

      // 動画の音声を有効化（※完全無音で流したい場合はここを mainVideoPlayer.muted = true; に変更）
      mainVideoPlayer.muted = false;
      mainVideoPlayer.src = resolvePlayableUrl(card.videoUrl);

      if (fromQueue && playQueue.length > 0) {
        theaterQueueBadge.textContent = `${queueLabel}（${queuePos + 1} / ${playQueue.length}本目）`;
      } else {
        theaterQueueBadge.textContent = `▶ カード ${idx + 1} 再生中`;
      }
      theaterVideoTitle.textContent = `${card.favorite ? "★ " : ""}${card.title}`;
      scanStatusText.textContent = `🎬 再生中: ${card.title}`;

      mainVideoPlayer.play().catch(() => {
        theaterVideoTitle.textContent = `❌ 動画の読み込みに失敗: ${card.videoUrl}`;
      });

      renderCardList();
    }

    mainVideoPlayer.addEventListener("ended", () => {
      if (playQueue.length > 0 && queuePos + 1 < playQueue.length) {
        queuePos++;
        playVideoCard(playQueue[queuePos], true);
      } else {
        const finishedName = queueLabel;
        stopVideoPlayback();
        if (finishedName) {
          scanStatusText.textContent = `✅ ${finishedName} が完了しました`;
        }
      }
    });

    function startQueuePlayback(indices, label) {
      if (!indices || indices.length === 0) {
        scanStatusText.textContent = label.includes("お気に入り")
          ? "⚠️ 先に「☆」を押してお気に入り登録してください"
          : "⚠️ 先にカードをタップして選択（☑）してください";
        return;
      }
      playQueue = [...indices];
      queuePos = 0;
      queueLabel = label;
      playVideoCard(playQueue[0], true);
    }

    playFavSeqBtn.addEventListener("click", () => {
      const favIndices = videoCards
        .map((c, idx) => (c.favorite ? idx : -1))
        .filter(idx => idx !== -1);
      startQueuePlayback(favIndices, "★ お気に入り連続再生");
    });

    playSelSeqBtn.addEventListener("click", () => {
      const selIndices = Array.from(selectedSet)
        .filter(idx => idx >= 0 && idx < videoCards.length)
        .sort((a, b) => a - b);
      startQueuePlayback(selIndices, "▶ 選択カード連続再生");
    });

    nextVideoBtn.addEventListener("click", () => {
      if (playQueue.length > 0 && queuePos + 1 < playQueue.length) {
        queuePos++;
        playVideoCard(playQueue[queuePos], true);
      } else if (videoCards.length > 0) {
        const nextIdx = (currentPlayingIdx + 1) % videoCards.length;
        playQueue = [];
        queuePos = -1;
        playVideoCard(nextIdx, false);
      }
    });

    stopVideoBtn.addEventListener("click", stopVideoPlayback);
    closeTheaterBtn.addEventListener("click", stopVideoPlayback);

    clearSelBtn.addEventListener("click", () => {
      selectedSet.clear();
      renderCardList();
    });

    // =========================================================
    // カメラでのARカード読み取りイベント（targetIndex 0〜9）
    // =========================================================
    for (let i = 0; i < 10; i++) {
      const slotEl = document.getElementById(`targetSlot${i}`);
      if (!slotEl) continue;

      slotEl.addEventListener("targetFound", () => {
        const cardIdx = videoCards.findIndex(c => Number(c.targetIndex) === i);
        const targetIdx = cardIdx !== -1 ? cardIdx : i;
        if (videoCards[targetIdx] && currentPlayingIdx !== targetIdx) {
          playQueue = [];
          queuePos = -1;
          playVideoCard(targetIdx, false);
        }
      });
    }

    // =========================================================
    // カード一覧描画（お気に入り切替・複数選択・個別再生）
    // =========================================================
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function renderCardList() {
      selectedSet.forEach(idx => {
        if (idx < 0 || idx >= videoCards.length) selectedSet.delete(idx);
      });

      const favCount = videoCards.filter(c => c.favorite).length;
      cntAll.textContent = videoCards.length;
      cntFav.textContent = favCount;
      cntSel.textContent = selectedSet.size;

      cardListContainer.innerHTML = "";

      const filtered = videoCards
        .map((card, idx) => ({ card, idx }))
        .filter(({ card, idx }) => {
          if (activeFilter === "fav") return card.favorite;
          if (activeFilter === "selected") return selectedSet.has(idx);
          return true;
        });

      if (filtered.length === 0) {
        cardListContainer.innerHTML = `<div style="text-align:center; color:#64748b; font-size:0.8rem; padding:12px;">該当する動画カードがありません</div>`;
        return;
      }

      filtered.forEach(({ card, idx }) => {
        const isSel = selectedSet.has(idx);
        const isPlay = currentPlayingIdx === idx;

        const row = document.createElement("div");
        row.className = "video-card-item"
          + (isSel ? " is-selected" : "")
          + (isPlay ? " is-playing" : "");

        const left = document.createElement("div");
        left.className = "card-select-area";
        left.innerHTML = `
          <div class="check-box">${isSel ? "✓" : ""}</div>
          <div style="overflow:hidden;">
            <div class="card-title-text">${idx + 1}. ${escapeHtml(card.title)}</div>
            <div class="card-meta-text">マーカー #${card.targetIndex ?? idx} ・ ${isSel ? "連続再生に選択中" : "タップで選択"}</div>
          </div>
        `;
        left.addEventListener("click", () => {
          if (selectedSet.has(idx)) {
            selectedSet.delete(idx);
          } else {
            selectedSet.add(idx);
          }
          renderCardList();
        });

        const right = document.createElement("div");
        right.className = "card-right-btns";

        const starBtn = document.createElement("button");
        starBtn.type = "button";
        starBtn.className = "star-btn" + (card.favorite ? " active" : "");
        starBtn.textContent = card.favorite ? "★" : "☆";
        starBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          videoCards[idx].favorite = !videoCards[idx].favorite;
          saveCards();
        });

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "play-one-btn";
        playBtn.textContent = isPlay ? "🎬 再生中" : "▶ 再生";
        playBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          playQueue = [];
          queuePos = -1;
          playVideoCard(idx, false);
        });

        right.appendChild(starBtn);
        right.appendChild(playBtn);
        row.appendChild(left);
        row.appendChild(right);
        cardListContainer.appendChild(row);
      });
    }

    filterTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        filterTabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        renderCardList();
      });
    });

    addVideoCardBtn.addEventListener("click", () => {
      const url = normalizeMediaUrl(newCardVideoUrl.value);
      if (!url) return;
      const title = newCardTitle.value.trim() || `カード${videoCards.length + 1}：動画`;
      videoCards.push({
        targetIndex: videoCards.length,
        title,
        videoUrl: url,
        favorite: false
      });
      newCardTitle.value = "";
      newCardVideoUrl.value = "";
      saveCards();
    });

    // 下部ドロワー開閉
    panelToggleHeader.addEventListener("click", () => {
      const collapsed = bottomPanel.classList.toggle("collapsed");
      panelToggleHint.textContent = collapsed ? "▲ 開く" : "▼ 折りたたむ";
    });

    // ARカメラ起動＆ブラウザの自動再生ロック解除
    startArBtn.addEventListener("click", async () => {
      mainVideoPlayer.play().then(() => mainVideoPlayer.pause()).catch(() => {});
      startOverlay.style.display = "none";

      try {
        const arSystem = mindArScene.systems["mindar-image-system"];
        if (arSystem) {
          await arSystem.start();
        }
      } catch (e) {
        scanStatusText.textContent = "📋 リストからカードを選んで再生できます";
      }
    });

    // 初期化
    loadCardsFromLocal();
    renderCardList();
  </script>
</body>
</html>
