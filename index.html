<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR カード動画リーダー</title>

  <!-- A-Frame & MindAR（画像カード認識ライブラリ） -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    #arSceneWrapper {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }

    #startArBtn {
      padding: 18px 36px;
      font-size: 1.15rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.45);
      cursor: pointer;
    }

    .top-hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .status-pill-bar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 0.78rem;
      text-align: center;
    }

    /* 追加カードをかざすためのガイド枠（登録カードがある時だけ表示） */
    #scanGuideBox {
      position: fixed;
      top: 34%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(62vw, 250px);
      aspect-ratio: 3 / 4;
      border: 2px dashed rgba(56, 189, 248, 0.65);
      border-radius: 16px;
      z-index: 10;
      pointer-events: none;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      box-shadow: 0 0 0 9999px rgba(2, 6, 23, 0.25);
    }

    #scanGuideBox.visible {
      display: flex;
    }

    #scanGuideLabel {
      background: rgba(15, 23, 42, 0.82);
      color: #38bdf8;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 99px;
    }

    /* 正面固定 動画再生シアター枠 */
    #videoTheaterOverlay {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 440px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border: 2px solid #38bdf8;
      border-radius: 18px;
      padding: 10px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }

    #videoTheaterOverlay.active {
      display: flex;
    }

    #mainVideoPlayer {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      object-fit: contain;
    }

    .theater-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
    }

    .theater-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 下部ドロワー */
    .bottom-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px 20px 0 0;
      padding: 12px 14px 20px;
      max-height: 54dvh;
      display: flex;
      flex-direction: column;
      gap: 9px;
      transition: transform 0.25s ease;
    }

    .bottom-panel.collapsed {
      transform: translateY(calc(100% - 50px));
    }

    .panel-handle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }

    .control-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 9px 8px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-fav-seq {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
    }

    .btn-sel-seq {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
    }

    .btn-next {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    .btn-stop {
      background: #ef4444;
      color: #ffffff;
    }

    .filter-row {
      display: flex;
      gap: 5px;
    }

    .filter-tab {
      flex: 1;
      padding: 6px 4px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.73rem;
      font-weight: bold;
      cursor: pointer;
    }

    .filter-tab.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
    }

    .open-add-modal-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-size: 0.74rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .card-scroll-area {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 2px;
    }

    .video-card-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 12px;
      padding: 8px 10px;
    }

    .video-card-item.is-selected {
      border-color: #38bdf8;
      background: rgba(14, 116, 144, 0.25);
    }

    .video-card-item.is-playing {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.22);
    }

    .card-select-area {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
    }

    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #475569;
      background: #020617;
      color: #0f172a;
      font-size: 0.75rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .video-card-item.is-selected .check-box {
      background: #38bdf8;
      border-color: #38bdf8;
    }

    .card-thumb {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      object-fit: cover;
      background: #1e293b;
      border: 1px solid #475569;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: #94a3b8;
    }

    .card-title-text {
      font-size: 0.85rem;
      font-weight: bold;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta-text {
      font-size: 0.68rem;
      color: #94a3b8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-right-btns {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .star-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #64748b;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .star-btn.active {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .play-one-btn {
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      background: #1e293b;
      color: #38bdf8;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
    }

    .edit-btn {
      padding: 6px 7px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .del-btn {
      padding: 6px 7px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #f87171;
      font-size: 0.72rem;
      cursor: pointer;
    }

    #addCardModal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #addCardModal.open {
      display: flex;
    }

    .modal-box {
      width: min(94vw, 420px);
      max-height: 88dvh;
      overflow-y: auto;
      background: #0f172a;
      border: 1.5px solid #38bdf8;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 0.78rem;
      font-weight: bold;
      color: #cbd5e1;
    }

    .text-input, .file-input {
      width: 100%;
      background: #020617;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
    }

    .preview-img {
      width: 100%;
      max-height: 130px;
      object-fit: contain;
      border-radius: 10px;
      background: #020617;
      border: 1px dashed #475569;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 起動オーバーレイ -->
  <div id="startOverlay">
    <h2 style="font-size: 1.45rem; color: #38bdf8;">🎬 AR カード動画リーダー</h2>
    <p style="color: #94a3b8; font-size: 0.86rem; line-height: 1.6;">
      カメラにカードをかざすと動画が再生されます。<br>
      ★お気に入りや☑選択したカードのみ、かざさずに連続再生できます。
    </p>
    <button id="startArBtn" type="button">▶ カメラ＆ARを起動する</button>
  </div>

  <!-- 上部ステータスHUD -->
  <div class="top-hud">
    <div class="status-pill-bar">
      <span id="scanStatusText" style="color: #38bdf8; font-weight: bold;">📷 カードをかざすと動画が流れます</span>
    </div>
  </div>

  <!-- 追加カード用スキャンガイド枠 -->
  <div id="scanGuideBox">
    <span id="scanGuideLabel">追加カードはこの枠内に収めてかざす</span>
  </div>

  <!-- 正面固定 動画再生シアター枠 -->
  <div id="videoTheaterOverlay">
    <div class="theater-header">
      <span id="theaterQueueBadge" style="color: #38bdf8; font-weight: bold;">▶ 再生中</span>
      <div class="theater-actions">
        <button type="button" id="unmuteBtn" style="display:none; background:#f59e0b; color:#0f172a; border:none; border-radius:7px; padding:4px 9px; font-size:0.74rem; font-weight:bold; cursor:pointer;">🔊 音声ON</button>
        <button type="button" id="closeTheaterBtn" style="background:#ef4444; color:#fff; border:none; border-radius:7px; padding:4px 9px; font-size:0.74rem; font-weight:bold; cursor:pointer;">✕ 閉じる</button>
      </div>
    </div>
    <video id="mainVideoPlayer" playsinline webkit-playsinline controls></video>
    <div id="theaterVideoTitle" style="font-size: 0.9rem; font-weight: bold; color: #f8fafc; text-align: center;"></div>
  </div>

  <!-- A-Frame + MindAR カメラシーン -->
  <div id="arSceneWrapper">
    <a-scene
      id="mindArScene"
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="targetSlot0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="targetSlot1" mindar-image-target="targetIndex: 1"></a-entity>
      <a-entity id="targetSlot2" mindar-image-target="targetIndex: 2"></a-entity>
      <a-entity id="targetSlot3" mindar-image-target="targetIndex: 3"></a-entity>
      <a-entity id="targetSlot4" mindar-image-target="targetIndex: 4"></a-entity>
      <a-entity id="targetSlot5" mindar-image-target="targetIndex: 5"></a-entity>
      <a-entity id="targetSlot6" mindar-image-target="targetIndex: 6"></a-entity>
      <a-entity id="targetSlot7" mindar-image-target="targetIndex: 7"></a-entity>
      <a-entity id="targetSlot8" mindar-image-target="targetIndex: 8"></a-entity>
      <a-entity id="targetSlot9" mindar-image-target="targetIndex: 9"></a-entity>
      <a-entity id="targetSlot10" mindar-image-target="targetIndex: 10"></a-entity>
      <a-entity id="targetSlot11" mindar-image-target="targetIndex: 11"></a-entity>
      <a-entity id="targetSlot12" mindar-image-target="targetIndex: 12"></a-entity>
      <a-entity id="targetSlot13" mindar-image-target="targetIndex: 13"></a-entity>
      <a-entity id="targetSlot14" mindar-image-target="targetIndex: 14"></a-entity>
      <a-entity id="targetSlot15" mindar-image-target="targetIndex: 15"></a-entity>
      <a-entity id="targetSlot16" mindar-image-target="targetIndex: 16"></a-entity>
      <a-entity id="targetSlot17" mindar-image-target="targetIndex: 17"></a-entity>
      <a-entity id="targetSlot18" mindar-image-target="targetIndex: 18"></a-entity>
      <a-entity id="targetSlot19" mindar-image-target="targetIndex: 19"></a-entity>
      <a-entity id="targetSlot20" mindar-image-target="targetIndex: 20"></a-entity>
      <a-entity id="targetSlot21" mindar-image-target="targetIndex: 21"></a-entity>
      <a-entity id="targetSlot22" mindar-image-target="targetIndex: 22"></a-entity>
      <a-entity id="targetSlot23" mindar-image-target="targetIndex: 23"></a-entity>
      <a-entity id="targetSlot24" mindar-image-target="targetIndex: 24"></a-entity>
      <a-entity id="targetSlot25" mindar-image-target="targetIndex: 25"></a-entity>
      <a-entity id="targetSlot26" mindar-image-target="targetIndex: 26"></a-entity>
      <a-entity id="targetSlot27" mindar-image-target="targetIndex: 27"></a-entity>
      <a-entity id="targetSlot28" mindar-image-target="targetIndex: 28"></a-entity>
      <a-entity id="targetSlot29" mindar-image-target="targetIndex: 29"></a-entity>
    </a-scene>
  </div>

  <!-- 下部操作パネル -->
  <div class="bottom-panel" id="bottomPanel">
    <div class="panel-handle-row" id="panelToggleHeader">
      <span style="font-size: 0.9rem; font-weight: bold; color: #38bdf8;">🎬 登録・お気に入り・選択カード</span>
      <span id="panelToggleHint" style="font-size: 0.74rem; color: #94a3b8;">▼ 折りたたむ</span>
    </div>

    <div class="control-btn-grid">
      <button type="button" class="btn btn-fav-seq" id="playFavSeqBtn">★ お気に入り連続再生</button>
      <button type="button" class="btn btn-sel-seq" id="playSelSeqBtn">▶ 選択カードを連続再生</button>
      <button type="button" class="btn btn-next" id="nextVideoBtn">⏭ 次の動画へ</button>
      <button type="button" class="btn btn-stop" id="stopVideoBtn">⏹ 再生停止</button>
    </div>

    <div class="filter-row">
      <button type="button" class="filter-tab active" data-filter="fav">★ お気に入り (<span id="cntFav">0</span>)</button>
      <button type="button" class="filter-tab" data-filter="selected">☑ 選択中 (<span id="cntSel">0</span>)</button>
      <button type="button" class="filter-tab" data-filter="manage">⚙ カード設定 (<span id="cntAll">0</span>)</button>
      <button type="button" class="open-add-modal-btn" id="openAddModalBtn">＋ 追加</button>
    </div>

    <div class="card-scroll-area" id="cardListContainer"></div>
  </div>

  <!-- 新しいカード画像＆動画の登録 / 既存カード編集モーダル -->
  <div id="addCardModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="modalHeaderTitle" style="font-size:1rem; color:#38bdf8;">＋ 新しいカード＆動画を登録</h3>
        <button type="button" id="closeAddModalBtn" style="background:none; border:none; color:#94a3b8; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <div class="field-group">
        <label class="field-label">1. カード名（タイトル）</label>
        <input type="text" id="modalCardTitle" class="text-input" placeholder="例：誕生日カード、旅行の思い出" />
      </div>

      <div class="field-group" id="modalImageFieldGroup">
        <label class="field-label">2. 新しいカード画像を選択（カメラでかざして認識）</label>
        <input type="file" id="modalCardImageFile" class="file-input" accept="image/*" />
        <img id="modalCardPreview" class="preview-img" alt="カードプレビュー" />
        <span style="font-size:0.7rem; color:#94a3b8;">※選んだカード画像をカメラ枠にかざすと下の動画が自動再生されます</span>
      </div>

      <div class="field-group">
        <label class="field-label">3. 流す動画を選択（端末内の動画ファイル）</label>
        <input type="file" id="modalVideoFile" class="file-input" accept="video/*" />
      </div>

      <div class="field-group">
        <label class="field-label">または 動画ファイル名 / URL を直接入力</label>
        <input type="text" id="modalVideoUrl" class="text-input" placeholder="./video1.mp4 や https://..." />
      </div>

      <button type="button" id="saveNewCardBtn" class="btn btn-sel-seq" style="padding:12px; font-size:0.9rem;">
        ✅ 保存する
      </button>
    </div>
  </div>

  <script>
    // =========================================================
    // ★ ここに30枚分の動画ファイル名（またはURL）を一気に記入！
    //    上から順に targetIndex 0 〜 29 に対応します
    // =========================================================
    const VIDEO_FILES = [
      "./video1.mp4",   // 1枚目 (targetIndex: 0)
      "./video2.mp4",   // 2枚目 (targetIndex: 1)
      "./video3.mp4",   // 3枚目 (targetIndex: 2)
      "./video4.mp4",   // 4枚目 (targetIndex: 3)
      "./video5.mp4",   // 5枚目 (targetIndex: 4)
      "./video6.mp4",   // 6枚目 (targetIndex: 5)
      "./video7.mp4",   // 7枚目 (targetIndex: 6)
      "./video8.mp4",   // 8枚目 (targetIndex: 7)
      "./video9.mp4",   // 9枚目 (targetIndex: 8)
      "./video10.mp4",  // 10枚目 (targetIndex: 9)
      "./video11.mp4",  // 11枚目 (targetIndex: 10)
      "./video12.mp4",  // 12枚目 (targetIndex: 11)
      "./video13.mp4",  // 13枚目 (targetIndex: 12)
      "./video14.mp4",  // 14枚目 (targetIndex: 13)
      "./video15.mp4",  // 15枚目 (targetIndex: 14)
      "./video16.mp4",  // 16枚目 (targetIndex: 15)
      "./video17.mp4",  // 17枚目 (targetIndex: 16)
      "./video18.mp4",  // 18枚目 (targetIndex: 17)
      "./video19.mp4",  // 19枚目 (targetIndex: 18)
      "./video20.mp4",  // 20枚目 (targetIndex: 19)
      "./video21.mp4",  // 21枚目 (targetIndex: 20)
      "./video22.mp4",  // 22枚目 (targetIndex: 21)
      "./video23.mp4",  // 23枚目 (targetIndex: 22)
      "./video24.mp4",  // 24枚目 (targetIndex: 23)
      "./video25.mp4",  // 25枚目 (targetIndex: 24)
      "./video26.mp4",  // 26枚目 (targetIndex: 25)
      "./video27.mp4",  // 27枚目 (targetIndex: 26)
      "./video28.mp4",  // 28枚目 (targetIndex: 27)
      "./video29.mp4",  // 29枚目 (targetIndex: 28)
      "./video30.mp4"   // 30枚目 (targetIndex: 29)
    ];

    const DEFAULT_VIDEO_CARDS = VIDEO_FILES.map((file, i) => ({
      id: `preset_${i}`,
      type: "mindar",
      targetIndex: i,
      title: `カード ${i + 1}`,
      videoUrl: file,
      favorite: false
    }));

    // DOM参照
    const startOverlay = document.getElementById("startOverlay");
    const startArBtn = document.getElementById("startArBtn");
    const mindArScene = document.getElementById("mindArScene");
    const scanStatusText = document.getElementById("scanStatusText");
    const scanGuideBox = document.getElementById("scanGuideBox");
    const scanGuideLabel = document.getElementById("scanGuideLabel");

    const videoTheaterOverlay = document.getElementById("videoTheaterOverlay");
    const mainVideoPlayer = document.getElementById("mainVideoPlayer");
    const theaterQueueBadge = document.getElementById("theaterQueueBadge");
    const theaterVideoTitle = document.getElementById("theaterVideoTitle");
    const unmuteBtn = document.getElementById("unmuteBtn");

    // =========================================================
    // 既存の MindAR 30枚ターゲットスロットへのイベント紐付け
    // =========================================================
    function bindMindArTargetEvents() {
      for (let i = 0; i < VIDEO_FILES.length; i++) {
        const slotEl = document.getElementById(`targetSlot${i}`);
        if (!slotEl) continue;

        slotEl.addEventListener("targetFound", () => {
          const cardIdx = videoCards.findIndex(c => c.type !== "custom" && Number(c.targetIndex) === i);
          const targetIdx = cardIdx !== -1 ? cardIdx : i;
          if (videoCards[targetIdx] && currentPlayingIdx !== targetIdx) {
            playQueue = [];
            queuePos = -1;
            playVideoCard(targetIdx, false);
          }
        });
      }
    }

    // =========================================================
    // IndexedDB（新規カード画像・ローカル動画の永続保存）
    // =========================================================
    const DB_NAME = "ArCardVideoStorageDB_30";
    const STORE_NAME = "mediaBlobs";

    function openMediaDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function putBlobToDB(key, blob) {
      const db = await openMediaDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getBlobFromDB(key) {
      const db = await openMediaDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteBlobFromDB(key) {
      if (!key) return;
      const db = await openMediaDB();
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).delete(key);
    }

    // =========================================================
    // 追加カード画像のリアルタイム画像認識エンジン（修正版）
    // =========================================================
    const customCardPatterns = [];
    const scanCanvas = document.createElement("canvas");
    const scanCtx = scanCanvas.getContext("2d", { willReadFrequently: true });

    // MindARが生成したカメラの<video>要素をページ全体から確実に探す
    function findActiveCameraVideo() {
      const videos = Array.from(document.querySelectorAll("video"));
      for (const v of videos) {
        if (v.id === "mainVideoPlayer") continue;
        if (v.srcObject && v.readyState >= 2 && v.videoWidth > 0) {
          return v;
        }
      }
      return null;
    }

    // 縦横比を保ったまま特徴量（輝度分布＋縦横エッジ）を抽出
    function computeImageFeatures(imgOrVideo, sx = 0, sy = 0, sw = null, sh = null) {
      const w = sw || imgOrVideo.videoWidth || imgOrVideo.naturalWidth || imgOrVideo.width;
      const h = sh || imgOrVideo.videoHeight || imgOrVideo.naturalHeight || imgOrVideo.height;
      if (!w || !h) return null;

      // 16x16に正規化して輝度とエッジの両方を抽出（照明変化・多少の傾きに強い）
      const size = 16;
      scanCanvas.width = size;
      scanCanvas.height = size;
      scanCtx.drawImage(imgOrVideo, sx, sy, w, h, 0, 0, size, size);
      const data = scanCtx.getImageData(0, 0, size, size).data;

      const grays = new Float32Array(size * size);
      let sum = 0;
      for (let i = 0; i < size * size; i++) {
        const g = data[i * 4] * 0.299 + data[i * 4 + 1] * 0.587 + data[i * 4 + 2] * 0.114;
        grays[i] = g;
        sum += g;
      }
      const mean = sum / grays.length;
      let variance = 0;
      for (let i = 0; i < grays.length; i++) {
        variance += (grays[i] - mean) ** 2;
      }
      const stdDev = Math.sqrt(variance / grays.length);
      if (stdDev < 10) return null; // 無地の壁などは除外

      // 正規化ベクトル（平均0・分散1に揃えて明るさの違いを吸収）
      const norm = new Float32Array(size * size);
      for (let i = 0; i < grays.length; i++) {
        norm[i] = (grays[i] - mean) / stdDev;
      }
      return { norm, aspect: w / h };
    }

    // コサイン類似度（0.0〜1.0、0.68以上で高い一致）
    function compareImageFeatures(featA, featB) {
      if (!featA || !featB) return 0;
      let dot = 0;
      const len = featA.norm.length;
      for (let i = 0; i < len; i++) {
        dot += featA.norm[i] * featB.norm[i];
      }
      return dot / len;
    }

    function loadImageElement(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    let customScanTimer = null;
    let lastMatchedCustomId = null;
    let matchStreakCount = 0;

    function updateScanGuideVisibility() {
      if (customCardPatterns.length > 0 && currentPlayingIdx === -1) {
        scanGuideBox.classList.add("visible");
      } else {
        scanGuideBox.classList.remove("visible");
      }
    }

    function startCustomCardScanner() {
      if (customScanTimer) clearInterval(customScanTimer);

      customScanTimer = setInterval(() => {
        updateScanGuideVisibility();
        if (customCardPatterns.length === 0 || currentPlayingIdx !== -1) return;

        const camVideo = findActiveCameraVideo();
        if (!camVideo) return;

        const vw = camVideo.videoWidth;
        const vh = camVideo.videoHeight;

        let bestCardId = null;
        let bestCardTitle = "";
        let bestScore = 0;

        // 登録された各カードの縦横比に合わせてカメラ中央を切り出して照合
        const scales = [0.45, 0.62, 0.78];

        for (const pat of customCardPatterns) {
          const targetAspect = pat.feat.aspect;

          for (const s of scales) {
            let cw = vw * s;
            let ch = cw / targetAspect;
            if (ch > vh * 0.85) {
              ch = vh * 0.85;
              cw = ch * targetAspect;
            }
            const sx = (vw - cw) / 2;
            const sy = (vh - ch) / 2;

            const frameFeat = computeImageFeatures(camVideo, sx, sy, cw, ch);
            if (!frameFeat) continue;

            const score = compareImageFeatures(frameFeat, pat.feat);
            if (score > bestScore) {
              bestScore = score;
              bestCardId = pat.cardId;
              bestCardTitle = pat.title;
            }
          }
        }

        // 一致率が一定以上のときガイド枠にリアルタイム反応を表示
        if (bestScore >= 0.55 && bestCardId) {
          const pct = Math.min(100, Math.round(bestScore * 100));
          scanGuideLabel.textContent = `🔍 照合中: ${bestCardTitle} (${pct}%)`;
          scanGuideBox.style.borderColor = bestScore >= 0.68 ? "#10b981" : "#f59e0b";
        } else {
          scanGuideLabel.textContent = "追加カードはこの枠内に収めてかざす";
          scanGuideBox.style.borderColor = "rgba(56, 189, 248, 0.65)";
        }

        // 一致率 68% 以上が2回連続で成立したら自動再生開始
        if (bestScore >= 0.68 && bestCardId) {
          if (lastMatchedCustomId === bestCardId) {
            matchStreakCount++;
          } else {
            lastMatchedCustomId = bestCardId;
            matchStreakCount = 1;
          }

          if (matchStreakCount >= 2) {
            matchStreakCount = 0;
            const targetIdx = videoCards.findIndex(c => c.id === bestCardId);
            if (targetIdx !== -1 && currentPlayingIdx !== targetIdx) {
              playQueue = [];
              queuePos = -1;
              playVideoCard(targetIdx, false);
            }
          }
        } else {
          matchStreakCount = 0;
        }
      }, 280);
    }

    // =========================================================
    // URL解決 & カードデータ読み込み
    // =========================================================
    function normalizeMediaUrl(raw) {
      const s = (raw || "").trim();
      if (!s) return "";
      if (/^https?:\/\//i.test(s)) {
        try {
          const u = new URL(s);
          if (u.hostname.includes("dropbox.com")) {
            u.searchParams.delete("dl");
            u.searchParams.set("raw", "1");
            return u.toString();
          }
        } catch (e) {}
        return s;
      }
      if (/^(\.\/|\.\.\/|\/|blob:)/i.test(s)) return s;
      return `./${s}`;
    }

    async function resolveCardVideoSrc(card) {
      if (card.videoBlobKey) {
        if (activeObjectUrls.has(card.videoBlobKey)) {
          return activeObjectUrls.get(card.videoBlobKey);
        }
        const blob = await getBlobFromDB(card.videoBlobKey);
        if (blob) {
          const url = URL.createObjectURL(blob);
          activeObjectUrls.set(card.videoBlobKey, url);
          return url;
        }
      }
      const norm = normalizeMediaUrl(card.videoUrl);
      if (/^(https?:\/\/|blob:)/i.test(norm)) return norm;
      const full = new URL(norm, window.location.href).href;
      return encodeURI(decodeURI(full));
    }

    async function hydrateCustomMedia() {
      customCardPatterns.length = 0;
      for (const card of videoCards) {
        if (card.imageBlobKey) {
          let imgUrl = activeObjectUrls.get(card.imageBlobKey);
          if (!imgUrl) {
            const blob = await getBlobFromDB(card.imageBlobKey);
            if (blob) {
              imgUrl = URL.createObjectURL(blob);
              activeObjectUrls.set(card.imageBlobKey, imgUrl);
            }
          }
          if (imgUrl) {
            card._previewUrl = imgUrl;
            try {
              const imgEl = await loadImageElement(imgUrl);
              const feat = computeImageFeatures(imgEl);
              if (feat) {
                customCardPatterns.push({
                  cardId: card.id,
                  title: card.title,
                  feat
                });
              }
            } catch (e) {}
          }
        }
      }
      updateScanGuideVisibility();
    }

    async function loadCardsFromLocal() {
      const saved = JSON.parse(localStorage.getItem("ar_video_cards_30_v3") || "null");
      if (Array.isArray(saved) && saved.length > 0) {
        videoCards = saved.map(card => {
          if (card.type === "mindar" && !card.manualEdited && VIDEO_FILES[card.targetIndex] !== undefined) {
            return { ...card, videoUrl: VIDEO_FILES[card.targetIndex] };
          }
          return card;
        });
      } else {
        videoCards = DEFAULT_VIDEO_CARDS.map(c => ({ ...c }));
      }
      await hydrateCustomMedia();
      renderCardList();
    }

    function saveCards() {
      const clean = videoCards.map(({ _previewUrl, ...rest }) => rest);
      localStorage.setItem("ar_video_cards_30_v3", JSON.stringify(clean));
      renderCardList();
    }

    // =========================================================
    // 動画再生・連続再生エンジン
    // =========================================================
    function stopVideoPlayback() {
      mainVideoPlayer.pause();
      mainVideoPlayer.removeAttribute("src");
      mainVideoPlayer.load();
      videoTheaterOverlay.classList.remove("active");
      unmuteBtn.style.display = "none";

      playQueue = [];
      queuePos = -1;
      queueLabel = "";
      currentPlayingIdx = -1;
      scanStatusText.textContent = "📷 カードをかざすと動画が流れます";
      updateScanGuideVisibility();
      renderCardList();
    }

    async function playVideoCard(idx, fromQueue = false) {
      const card = videoCards[idx];
      if (!card) {
        stopVideoPlayback();
        return;
      }

      currentPlayingIdx = idx;
      updateScanGuideVisibility();
      videoTheaterOverlay.classList.add("active");
      unmuteBtn.style.display = "none";

      const srcUrl = await resolveCardVideoSrc(card);
      mainVideoPlayer.muted = false;
      mainVideoPlayer.src = srcUrl;

      if (fromQueue && playQueue.length > 0) {
        theaterQueueBadge.textContent = `${queueLabel}（${queuePos + 1} / ${playQueue.length}本目）`;
      } else {
        theaterQueueBadge.textContent = `▶ カード認識・再生中`;
      }
      theaterVideoTitle.textContent = `${card.favorite ? "★ " : ""}${card.title}`;
      scanStatusText.textContent = `🎬 再生中: ${card.title}`;

      try {
        await mainVideoPlayer.play();
      } catch (err) {
        mainVideoPlayer.muted = true;
        unmuteBtn.style.display = "inline-block";
        try {
          await mainVideoPlayer.play();
        } catch (err2) {
          theaterVideoTitle.textContent = `❌ 動画を再生できませんでした: ${card.videoUrl || card.title}`;
        }
      }

      renderCardList();
    }

    unmuteBtn.addEventListener("click", () => {
      mainVideoPlayer.muted = false;
      mainVideoPlayer.play().catch(() => {});
      unmuteBtn.style.display = "none";
    });

    mainVideoPlayer.addEventListener("ended", () => {
      if (playQueue.length > 0 && queuePos + 1 < playQueue.length) {
        queuePos++;
        playVideoCard(playQueue[queuePos], true);
      } else {
        const finishedName = queueLabel;
        stopVideoPlayback();
        if (finishedName) {
          scanStatusText.textContent = `✅ ${finishedName} が完了しました`;
        }
      }
    });

    function startQueuePlayback(indices, label) {
      if (!indices || indices.length === 0) {
        scanStatusText.textContent = label.includes("お気に入り")
          ? "⚠️「⚙ カード設定」から「☆」を押してお気に入り登録してください"
          : "⚠️「⚙ カード設定」からカードをタップして選択（☑）してください";
        return;
      }
      playQueue = [...indices];
      queuePos = 0;
      queueLabel = label;
      playVideoCard(playQueue[0], true);
    }

    playFavSeqBtn.addEventListener("click", () => {
      const favIndices = videoCards
        .map((c, idx) => (c.favorite ? idx : -1))
        .filter(idx => idx !== -1);
      startQueuePlayback(favIndices, "★ お気に入り連続再生");
    });

    playSelSeqBtn.addEventListener("click", () => {
      const selIndices = Array.from(selectedSet)
        .filter(idx => idx >= 0 && idx < videoCards.length)
        .sort((a, b) => a - b);
      startQueuePlayback(selIndices, "▶ 選択カード連続再生");
    });

    nextVideoBtn.addEventListener("click", () => {
      if (playQueue.length > 0 && queuePos + 1 < playQueue.length) {
        queuePos++;
        playVideoCard(playQueue[queuePos], true);
      } else if (currentPlayingIdx >= 0) {
        stopVideoPlayback();
      }
    });

    stopVideoBtn.addEventListener("click", stopVideoPlayback);
    closeTheaterBtn.addEventListener("click", stopVideoPlayback);

    // =========================================================
    // 新しいカード画像＆動画の登録 / 既存カード編集モーダル
    // =========================================================
    function openCardModal(editIdx = -1) {
      editingCardIndex = editIdx;
      modalCardImageFile.value = "";
      modalVideoFile.value = "";

      if (editIdx >= 0 && videoCards[editIdx]) {
        const c = videoCards[editIdx];
        modalHeaderTitle.textContent = `✎「${c.title}」の動画を編集`;
        modalCardTitle.value = c.title;
        modalVideoUrl.value = c.videoUrl || "";
        modalImageFieldGroup.style.display = c.type === "custom" ? "flex" : "none";
        if (c._previewUrl) {
          modalCardPreview.src = c._previewUrl;
          modalCardPreview.style.display = "block";
        } else {
          modalCardPreview.style.display = "none";
        }
      } else {
        modalHeaderTitle.textContent = "＋ 新しいカード＆動画を登録";
        modalCardTitle.value = "";
        modalVideoUrl.value = "";
        modalImageFieldGroup.style.display = "flex";
        modalCardPreview.style.display = "none";
      }
      addCardModal.classList.add("open");
    }

    openAddModalBtn.addEventListener("click", () => openCardModal(-1));

    closeAddModalBtn.addEventListener("click", () => {
      addCardModal.classList.remove("open");
    });

    modalCardImageFile.addEventListener("change", () => {
      const file = modalCardImageFile.files[0];
      if (!file) {
        modalCardPreview.style.display = "none";
        return;
      }
      modalCardPreview.src = URL.createObjectURL(file);
      modalCardPreview.style.display = "block";
    });

    saveNewCardBtn.addEventListener("click", async () => {
      const imgFile = modalCardImageFile.files[0];
      const vidFile = modalVideoFile.files[0];
      const rawUrl = normalizeMediaUrl(modalVideoUrl.value);

      if (editingCardIndex >= 0) {
        const target = videoCards[editingCardIndex];
        target.title = modalCardTitle.value.trim() || target.title;
        target.manualEdited = true;

        if (imgFile && target.type === "custom") {
          const imgKey = target.imageBlobKey || `img_${target.id}`;
          await putBlobToDB(imgKey, imgFile);
          target.imageBlobKey = imgKey;
          activeObjectUrls.delete(imgKey);
        }
        if (vidFile) {
          const vidKey = target.videoBlobKey || `vid_${target.id}`;
          await putBlobToDB(vidKey, vidFile);
          target.videoBlobKey = vidKey;
          target.videoUrl = "";
          activeObjectUrls.delete(vidKey);
        } else if (rawUrl) {
          if (target.videoBlobKey) {
            await deleteBlobFromDB(target.videoBlobKey);
            activeObjectUrls.delete(target.videoBlobKey);
            target.videoBlobKey = null;
          }
          target.videoUrl = rawUrl;
        }

        await hydrateCustomMedia();
        saveCards();
        addCardModal.classList.remove("open");
        scanStatusText.textContent = `✅「${target.title}」を更新しました`;
        return;
      }

      if (!imgFile) {
        alert("新しいカード画像を選択してください。");
        return;
      }
      if (!vidFile && !rawUrl) {
        alert("動画ファイルを選択するか、動画URLを入力してください。");
        return;
      }

      const newId = `custom_${Date.now()}`;
      const title = modalCardTitle.value.trim() || `追加カード ${videoCards.length + 1}`;

      const imageBlobKey = `img_${newId}`;
      await putBlobToDB(imageBlobKey, imgFile);

      let videoBlobKey = null;
      if (vidFile) {
        videoBlobKey = `vid_${newId}`;
        await putBlobToDB(videoBlobKey, vidFile);
      }

      videoCards.push({
        id: newId,
        type: "custom",
        targetIndex: videoCards.length,
        title,
        imageBlobKey,
        videoBlobKey,
        videoUrl: rawUrl,
        favorite: false
      });

      await hydrateCustomMedia();
      saveCards();
      addCardModal.classList.remove("open");
      scanStatusText.textContent = `✅「${title}」を登録しました（枠にかざして再生）`;
    });

    // =========================================================
    // カード一覧描画
    // =========================================================
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function renderCardList() {
      selectedSet.forEach(idx => {
        if (idx < 0 || idx >= videoCards.length) selectedSet.delete(idx);
      });

      const favCount = videoCards.filter(c => c.favorite).length;
      cntAll.textContent = videoCards.length;
      cntFav.textContent = favCount;
      cntSel.textContent = selectedSet.size;

      cardListContainer.innerHTML = "";

      const filtered = videoCards
        .map((card, idx) => ({ card, idx }))
        .filter(({ card, idx }) => {
          if (activeFilter === "fav") return card.favorite;
          if (activeFilter === "selected") return selectedSet.has(idx);
          return true;
        });

      if (filtered.length === 0) {
        const emptyMsg = activeFilter === "fav"
          ? "お気に入り登録されたカードはありません（「⚙ カード設定」から☆をタップ）"
          : "選択中のカードはありません（「⚙ カード設定」からカードをタップして選択）";
        cardListContainer.innerHTML = `<div style="text-align:center; color:#94a3b8; font-size:0.78rem; padding:14px 8px; line-height:1.5;">${emptyMsg}</div>`;
        return;
      }

      filtered.forEach(({ card, idx }) => {
        const isSel = selectedSet.has(idx);
        const isPlay = currentPlayingIdx === idx;
        const canDirectPlay = card.favorite || isSel;

        const row = document.createElement("div");
        row.className = "video-card-item"
          + (isSel ? " is-selected" : "")
          + (isPlay ? " is-playing" : "");

        const left = document.createElement("div");
        left.className = "card-select-area";

        const thumbHtml = card._previewUrl
          ? `<img src="${card._previewUrl}" class="card-thumb" alt="card" />`
          : `<div class="card-thumb">#${(card.targetIndex ?? idx) + 1}</div>`;

        const videoSourceLabel = card.videoBlobKey ? "端末動画" : (card.videoUrl || "未設定");
        const badgeText = card.type === "custom"
          ? `登録カード ・ ${videoSourceLabel}`
          : `AR #${card.targetIndex + 1} ・ ${videoSourceLabel}`;

        left.innerHTML = `
          <div class="check-box">${isSel ? "✓" : ""}</div>
          ${thumbHtml}
          <div style="overflow:hidden;">
            <div class="card-title-text">${escapeHtml(card.title)}</div>
            <div class="card-meta-text">${escapeHtml(badgeText)}</div>
          </div>
        `;
        left.addEventListener("click", () => {
          if (selectedSet.has(idx)) {
            selectedSet.delete(idx);
          } else {
            selectedSet.add(idx);
          }
          renderCardList();
        });

        const right = document.createElement("div");
        right.className = "card-right-btns";

        const starBtn = document.createElement("button");
        starBtn.type = "button";
        starBtn.className = "star-btn" + (card.favorite ? " active" : "");
        starBtn.textContent = card.favorite ? "★" : "☆";
        starBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          videoCards[idx].favorite = !videoCards[idx].favorite;
          saveCards();
        });
        right.appendChild(starBtn);

        if (canDirectPlay && activeFilter !== "manage") {
          const playBtn = document.createElement("button");
          playBtn.type = "button";
          playBtn.className = "play-one-btn";
          playBtn.textContent = isPlay ? "🎬 再生中" : "▶ 再生";
          playBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            playQueue = [];
            queuePos = -1;
            playVideoCard(idx, false);
          });
          right.appendChild(playBtn);
        }

        if (activeFilter === "manage") {
          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "edit-btn";
          editBtn.textContent = "✎";
          editBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openCardModal(idx);
          });
          right.appendChild(editBtn);

          if (card.type === "custom") {
            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "del-btn";
            delBtn.textContent = "🗑";
            delBtn.addEventListener("click", async (e) => {
              e.stopPropagation();
              if (!confirm(`「${card.title}」を削除しますか？`)) return;
              await deleteBlobFromDB(card.imageBlobKey);
              await deleteBlobFromDB(card.videoBlobKey);
              videoCards.splice(idx, 1);
              await hydrateCustomMedia();
              saveCards();
            });
            right.appendChild(delBtn);
          }
        }

        row.appendChild(left);
        row.appendChild(right);
        cardListContainer.appendChild(row);
      });
    }

    filterTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        filterTabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        renderCardList();
      });
    });

    panelToggleHeader.addEventListener("click", () => {
      const collapsed = bottomPanel.classList.toggle("collapsed");
      panelToggleHint.textContent = collapsed ? "▲ 開く" : "▼ 折りたたむ";
    });

    // ARカメラ起動＆認識開始
    startArBtn.addEventListener("click", async () => {
      mainVideoPlayer.muted = true;
      mainVideoPlayer.play().then(() => {
        mainVideoPlayer.pause();
        mainVideoPlayer.muted = false;
      }).catch(() => {});

      startOverlay.style.display = "none";

      try {
        const arSystem = mindArScene.systems["mindar-image-system"];
        if (arSystem) {
          await arSystem.start();
        }
      } catch (e) {
        scanStatusText.textContent = "⚠️ カメラまたは targets.mind の読み込みエラー";
      }
      startCustomCardScanner();
    });

    // 初期化
    bindMindArTargetEvents();
    loadCardsFromLocal();
  </script>
</body>
</html>
