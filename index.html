<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>30枚カード対応 WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.94);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      text-align: center;
    }

    #startBtn {
      margin-top: 24px;
      padding: 18px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
      cursor: pointer;
    }

    #statusBadge {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      z-index: 1000;
      pointer-events: none;
      border: 1px solid rgba(56, 189, 248, 0.3);
      white-space: nowrap;
    }

    /* 画面中央にピタッと固定表示する用のコンテナ */
    #fixedVideoContainer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 900;
      padding: 20px;
    }

    #fixedVideoDisplay {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 2px solid #38bdf8;
    }

    #controlPanel {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 12px 14px;
      z-index: 1000;
      display: none;
      flex-direction: column;
      gap: 10px;
      color: #f8fafc;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.85rem;
    }

    .speed-group {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    .speed-btn {
      flex: 1;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 7px 4px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .speed-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .action-btn-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 10px 8px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn.pinned {
      background: #10b981;
      color: #0f172a;
      border-color: #10b981;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
    }
  </style>

  <script>
    const VIDEO_LIST = [
      "./動作3.mp4",  "./動作4.mp4",  "./動作5.mp4",  "./video3.mp4",  "./video4.mp4",
      "./video5.mp4",  "./video6.mp4",  "./video7.mp4",  "./video8.mp4",  "./video9.mp4",
      "./video10.mp4", "./video11.mp4", "./video12.mp4", "./video13.mp4", "./video14.mp4",
      "./video15.mp4", "./video16.mp4", "./video17.mp4", "./video18.mp4", "./video19.mp4",
      "./video20.mp4", "./video21.mp4", "./video22.mp4", "./video23.mp4", "./video24.mp4",
      "./video25.mp4", "./video26.mp4", "./video27.mp4", "./video28.mp4", "./video29.mp4"
    ];

    const BASE_SIZE = 1.0;
    let currentAngleX = 35;
    let currentLoadedSrc = "./video0.mp4";
    let currentPlaybackRate = 1.0;
    let isPinned = false;

    function applyTrueAspectRatio(videoEl) {
      const vw = videoEl.videoWidth;
      const vh = videoEl.videoHeight;
      if (!vw || !vh) return;

      let scaleX, scaleY;
      if (vw >= vh) {
        scaleX = BASE_SIZE;
        scaleY = BASE_SIZE * (vh / vw);
      } else {
        scaleY = BASE_SIZE * 1.25;
        scaleX = scaleY * (vw / vh);
      }

      document.querySelectorAll(".ar-video-plane").forEach(plane => {
        plane.setAttribute("scale", `${scaleX.toFixed(4)} ${scaleY.toFixed(4)} 1`);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.getElementById("arScene");
      const statusBadge = document.getElementById("statusBadge");
      const mainVideo = document.getElementById("mainVideo");

      ["loadedmetadata", "loadeddata", "resize", "playing"].forEach(evt => {
        mainVideo.addEventListener(evt, () => {
          applyTrueAspectRatio(mainVideo);
          mainVideo.playbackRate = currentPlaybackRate;
        });
      });

      mainVideo.addEventListener("playing", () => {
        statusBadge.style.color = "#10b981";
      });

      mainVideo.addEventListener("error", () => {
        statusBadge.textContent = `❌ 動画エラー(${currentLoadedSrc}が見つかりません)`;
        statusBadge.style.color = "#ef4444";
      });

      VIDEO_LIST.forEach((src, index) => {
        const targetEntity = document.createElement("a-entity");
        targetEntity.setAttribute("mindar-image-target", `targetIndex: ${index}`);

        const videoPlane = document.createElement("a-video");
        videoPlane.classList.add("ar-video-plane");
        videoPlane.setAttribute("src", "#mainVideo");
        videoPlane.setAttribute("width", "1");
        videoPlane.setAttribute("height", "1");
        videoPlane.setAttribute("scale", "1 1 1");
        videoPlane.setAttribute("position", "0 0 0.25");
        videoPlane.setAttribute("rotation", `${currentAngleX} 0 0`);

        targetEntity.appendChild(videoPlane);
        sceneEl.appendChild(targetEntity);

        targetEntity.addEventListener("targetFound", () => {
          if (isPinned) return; // 画面固定中は別のカードに勝手に切り替わらないようにする

          statusBadge.textContent = `🎬 カード #${index + 1} を再生中`;
          statusBadge.style.color = "#10b981";

          if (currentLoadedSrc !== src) {
            currentLoadedSrc = src;
            mainVideo.pause();
            mainVideo.src = src;
            mainVideo.load();
          }

          mainVideo.playbackRate = currentPlaybackRate;
          applyTrueAspectRatio(mainVideo);

          mainVideo.play().catch(() => {
            statusBadge.textContent = `⏳ 読込中: ${src}`;
          });
        });

        targetEntity.addEventListener("targetLost", () => {
          if (isPinned) return; // 画面固定中はカードからカメラを外しても再生を続ける

          mainVideo.pause();
          statusBadge.textContent = "🔍 カードを探しています...";
          statusBadge.style.color = "#38bdf8";
        });
      });
    });
  </script>
</head>
<body>

  <div id="startOverlay">
    <h1 style="font-size: 1.6rem; margin-bottom: 8px;">📸 カードARカメラ</h1>
    <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.5;">
      カメラを起動してカードにかざすと<br>対応する動画が再生されます。
    </p>
    <button id="startBtn" type="button">▶ ARをスタート</button>
  </div>

  <div id="statusBadge" style="display: none;">🔍 カードを探しています...</div>

  <!-- 画面中央固定モード用の枠 -->
  <div id="fixedVideoContainer">
    <canvas id="fixedCanvas" style="max-width: 100%; max-height: 68vh; border-radius: 16px; border: 2px solid #10b981;"></canvas>
  </div>

  <div id="controlPanel">
    <!-- 再生速度コントロール -->
    <div class="ctrl-row">
      <span style="white-space: nowrap;">⏩ 速度:</span>
      <div class="speed-group">
        <button class="speed-btn" data-speed="0.5" type="button">0.5x</button>
        <button class="speed-btn active" data-speed="1.0" type="button">1.0x</button>
        <button class="speed-btn" data-speed="1.5" type="button">1.5x</button>
        <button class="speed-btn" data-speed="2.0" type="button">2.0x</button>
      </div>
    </div>

    <!-- 角度調整スライダー -->
    <div class="ctrl-row" id="angleCtrlRow">
      <span style="white-space: nowrap;">📐 角度:</span>
      <input type="range" id="angleSlider" min="0" max="90" value="35" />
      <span id="angleVal" style="width: 34px; text-align: right;">35°</span>
    </div>

    <!-- 音声 & 画面固定ボタン -->
    <div class="action-btn-row">
      <button id="muteToggleBtn" class="action-btn" type="button">🔇 音声ON</button>
      <button id="pinToggleBtn" class="action-btn" type="button">📌 画面に固定</button>
    </div>
  </div>

  <!--
    filterMinCF: 0.0001（小さいほど細かい手ブレ・ブルブルを強力にカット）
    filterBeta: 0.001（小さいほど動きが滑らかになり振動を抑える）
    missTolerance: 10（一瞬認識が外れてもチカチカ消えないようにする）
  -->
  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 10; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: false, antialias: false"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video
        id="mainVideo"
        src="./video0.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script>
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");
    const statusBadge = document.getElementById("statusBadge");
    const controlPanel = document.getElementById("controlPanel");
    const muteToggleBtn = document.getElementById("muteToggleBtn");
    const pinToggleBtn = document.getElementById("pinToggleBtn");
    const angleSlider = document.getElementById("angleSlider");
    const angleVal = document.getElementById("angleVal");
    const angleCtrlRow = document.getElementById("angleCtrlRow");
    const fixedVideoContainer = document.getElementById("fixedVideoContainer");
    const fixedCanvas = document.getElementById("fixedCanvas");
    const mainVideo = document.getElementById("mainVideo");
    const sceneEl = document.getElementById("arScene");

    let animFrameId = null;

    // 固定表示用の高画質キャンバス描画ループ
    function renderFixedCanvas() {
      if (!isPinned) return;
      if (mainVideo.readyState >= 2) {
        if (fixedCanvas.width !== mainVideo.videoWidth || fixedCanvas.height !== mainVideo.videoHeight) {
          fixedCanvas.width = mainVideo.videoWidth;
          fixedCanvas.height = mainVideo.videoHeight;
        }
        const ctx = fixedCanvas.getContext("2d");
        ctx.drawImage(mainVideo, 0, 0, fixedCanvas.width, fixedCanvas.height);
      }
      animFrameId = requestAnimationFrame(renderFixedCanvas);
    }

    // 画面に固定モードの切り替え
    pinToggleBtn.addEventListener("click", () => {
      isPinned = !isPinned;
      if (isPinned) {
        pinToggleBtn.classList.add("pinned");
        pinToggleBtn.textContent = "🔓 固定を解除";
        fixedVideoContainer.style.display = "flex";
        angleCtrlRow.style.display = "none";
        mainVideo.play().catch(() => {});
        renderFixedCanvas();
      } else {
        pinToggleBtn.classList.remove("pinned");
        pinToggleBtn.textContent = "📌 画面に固定";
        fixedVideoContainer.style.display = "none";
        angleCtrlRow.style.display = "flex";
        if (animFrameId) cancelAnimationFrame(animFrameId);
      }
    });

    // 速度変更ボタン
    document.querySelectorAll(".speed-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");

        currentPlaybackRate = parseFloat(e.target.dataset.speed);
        mainVideo.playbackRate = currentPlaybackRate;
      });
    });

    // 角度調整スライダー
    angleSlider.addEventListener("input", (e) => {
      const deg = e.target.value;
      angleVal.textContent = `${deg}°`;
      const zOffset = (deg / 90) * 0.45;
      document.querySelectorAll(".ar-video-plane").forEach(plane => {
        plane.setAttribute("rotation", `${deg} 0 0`);
        plane.setAttribute("position", `0 0 ${zOffset.toFixed(2)}`);
      });
    });

    // 音声オン・オフ切り替え
    muteToggleBtn.addEventListener("click", () => {
      mainVideo.muted = !mainVideo.muted;
      muteToggleBtn.textContent = mainVideo.muted ? "🔇 音声ON" : "🔊 音声ON中";
      if (!mainVideo.paused) mainVideo.play();
    });

    // ARスタート
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      startBtn.textContent = "カメラ起動中...";

      mainVideo.play().then(() => {
        mainVideo.pause();
        mainVideo.currentTime = 0;
      }).catch(() => {});

      const arSystem = sceneEl.systems["mindar-image-system"];
      await arSystem.start();

      startOverlay.style.display = "none";
      statusBadge.style.display = "block";
      controlPanel.style.display = "flex";
    });
  </script>
</body>
</html>
